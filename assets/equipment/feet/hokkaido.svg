<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Powder Snow Boots</title>
  
  <!-- Left Boot -->
  <g id="left-boot">
    <!-- Boot sole -->
    <rect x="4" y="40" width="16" height="4" fill="#3d3d3d"/>
    <!-- Boot main body -->
    <rect x="6" y="28" width="12" height="12" fill="#9b9285"/>
    <!-- Boot cuff/trim -->
    <rect x="4" y="24" width="16" height="4" fill="#e8e8e8"/>
    <!-- Boot accent stripe -->
    <rect x="6" y="32" width="12" height="2" fill="#e8e8e8"/>
  </g>
  
  <!-- Right Boot -->
  <g id="right-boot">
    <!-- Boot sole -->
    <rect x="44" y="40" width="16" height="4" fill="#3d3d3d"/>
    <!-- Boot main body -->
    <rect x="46" y="28" width="12" height="12" fill="#9b9285"/>
    <!-- Boot cuff/trim -->
    <rect x="44" y="24" width="16" height="4" fill="#e8e8e8"/>
    <!-- Boot accent stripe -->
    <rect x="46" y="32" width="12" height="2" fill="#e8e8e8"/>
  </g>
  
  <!-- Snow effect on boots -->
  <rect x="6" y="20" width="4" height="4" fill="#f0f8ff"/>
  <rect x="52" y="20" width="4" height="4" fill="#f0f8ff"/>
  <rect x="10" y="18" width="2" height="2" fill="#f0f8ff"/>
  <rect x="54" y="18" width="2" height="2" fill="#f0f8ff"/>
  
</svg>