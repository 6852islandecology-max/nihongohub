<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Lake Biwa Boots</title>
  
  <!-- Left Boot -->
  <g id="left-boot">
    <!-- Boot shaft -->
    <rect x="8" y="24" width="12" height="20" fill="#4a5f7f"/>
    <!-- Boot cuff -->
    <rect x="8" y="20" width="12" height="4" fill="#9b9285"/>
    <!-- Boot sole -->
    <rect x="8" y="44" width="12" height="4" fill="#3d3d3d"/>
    <!-- Boot toe -->
    <rect x="8" y="44" width="14" height="4" fill="#5a6b8f"/>
    <!-- Wader waterline stripe -->
    <rect x="8" y="32" width="12" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Right Boot -->
  <g id="right-boot">
    <!-- Boot shaft -->
    <rect x="44" y="24" width="12" height="20" fill="#4a5f7f"/>
    <!-- Boot cuff -->
    <rect x="44" y="20" width="12" height="4" fill="#9b9285"/>
    <!-- Boot sole -->
    <rect x="44" y="44" width="12" height="4" fill="#3d3d3d"/>
    <!-- Boot toe -->
    <rect x="42" y="44" width="14" height="4" fill="#5a6b8f"/>
    <!-- Wader waterline stripe -->
    <rect x="44" y="32" width="12" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Frame border accent -->
  <rect x="8" y="20" width="12" height="28" fill="none" stroke="#9b9285" stroke-width="1"/>
  <rect x="44" y="20" width="12" height="28" fill="none" stroke="#9b9285" stroke-width="1"/>
</svg>