<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Shinsaibashi Sneakers</title>
  
  <!-- Left Sneaker -->
  <g id="left-sneaker">
    <!-- Sole -->
    <rect x="4" y="40" width="20" height="4" fill="#3d3d3d"/>
    
    <!-- Main shoe body -->
    <rect x="6" y="32" width="16" height="8" fill="#e8e8e8"/>
    
    <!-- Shoe accent stripe -->
    <rect x="6" y="35" width="16" height="2" fill="#9b9285"/>
    
    <!-- Toe box highlight -->
    <rect x="18" y="32" width="4" height="4" fill="#f5f5f5"/>
    
    <!-- Heel -->
    <rect x="4" y="36" width="2" height="8" fill="#9b9285"/>
  </g>
  
  <!-- Right Sneaker -->
  <g id="right-sneaker">
    <!-- Sole -->
    <rect x="40" y="40" width="20" height="4" fill="#3d3d3d"/>
    
    <!-- Main shoe body -->
    <rect x="42" y="32" width="16" height="8" fill="#e8e8e8"/>
    
    <!-- Shoe accent stripe -->
    <rect x="42" y="35" width="16" height="2" fill="#9b9285"/>
    
    <!-- Toe box highlight -->
    <rect x="42" y="32" width="4" height="4" fill="#f5f5f5"/>
    
    <!-- Heel -->
    <rect x="58" y="36" width="2" height="8" fill="#9b9285"/>
  </g>
  
  <!-- Frame border -->
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#9b9285" stroke-width="2"/>
</svg>