<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Hot Spring Geta</title>
  
  <!-- Left Geta (wooden sandal) -->
  <g id="left-geta">
    <!-- Left sole wood base -->
    <rect x="8" y="36" width="16" height="12" fill="#8b7355"/>
    <!-- Left sole highlight -->
    <rect x="8" y="36" width="16" height="4" fill="#a0826d"/>
    <!-- Left thong strap upper -->
    <rect x="14" y="32" width="4" height="8" fill="#9b9285"/>
    <!-- Left thong strap detail -->
    <rect x="14" y="32" width="4" height="2" fill="#d4a574"/>
  </g>
  
  <!-- Right Geta (wooden sandal) -->
  <g id="right-geta">
    <!-- Right sole wood base -->
    <rect x="40" y="36" width="16" height="12" fill="#8b7355"/>
    <!-- Right sole highlight -->
    <rect x="40" y="36" width="16" height="4" fill="#a0826d"/>
    <!-- Right thong strap upper -->
    <rect x="46" y="32" width="4" height="8" fill="#9b9285"/>
    <!-- Right thong strap detail -->
    <rect x="46" y="32" width="4" height="2" fill="#d4a574"/>
  </g>
  
  <!-- Frame border accent -->
  <rect x="6" y="30" width="52" height="20" fill="none" stroke="#9b9285" stroke-width="2"/>
  
  <!-- Water steam detail (geta association with hot spring) -->
  <rect x="20" y="24" width="4" height="4" fill="#c9d9f0" opacity="0.7"/>
  <rect x="40" y="20" width="4" height="4" fill="#c9d9f0" opacity="0.7"/>
  <rect x="30" y="18" width="4" height="4" fill="#c9d9f0" opacity="0.5"/>
</svg>