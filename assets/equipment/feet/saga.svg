<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Saga Balloon Festival Boots</title>
  
  <!-- Left Boot -->
  <g id="left-boot">
    <!-- Boot sole -->
    <rect x="4" y="44" width="20" height="4" fill="#3d3d3d"/>
    <!-- Boot main body -->
    <rect x="6" y="36" width="16" height="8" fill="#9b9285"/>
    <!-- Boot upper -->
    <rect x="8" y="32" width="12" height="4" fill="#8b7b6f"/>
    <!-- Balloon attachment - red -->
    <rect x="10" y="20" width="8" height="4" fill="#d63031"/>
    <!-- Balloon attachment - yellow -->
    <rect x="10" y="16" width="8" height="4" fill="#f9ca24"/>
    <!-- Balloon attachment - blue -->
    <rect x="10" y="12" width="8" height="4" fill="#4169e1"/>
    <!-- String -->
    <rect x="13" y="8" width="2" height="12" fill="#6c5547"/>
  </g>
  
  <!-- Right Boot -->
  <g id="right-boot">
    <!-- Boot sole -->
    <rect x="40" y="44" width="20" height="4" fill="#3d3d3d"/>
    <!-- Boot main body -->
    <rect x="42" y="36" width="16" height="8" fill="#9b9285"/>
    <!-- Boot upper -->
    <rect x="44" y="32" width="12" height="4" fill="#8b7b6f"/>
    <!-- Balloon attachment - blue -->
    <rect x="46" y="20" width="8" height="4" fill="#4169e1"/>
    <!-- Balloon attachment - red -->
    <rect x="46" y="16" width="8" height="4" fill="#d63031"/>
    <!-- Balloon attachment - yellow -->
    <rect x="46" y="12" width="8" height="4" fill="#f9ca24"/>
    <!-- String -->
    <rect x="49" y="8" width="2" height="12" fill="#6c5547"/>
  </g>
  
  <!-- Frame border -->
  <g id="frame" opacity="0.8">
    <rect x="2" y="2" width="60" height="60" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
</svg>