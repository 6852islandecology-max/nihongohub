<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Bonsai Garden Slippers</title>
  
  <!-- Left slipper base (wood) -->
  <g id="left-slipper">
    <!-- Sole -->
    <rect x="4" y="40" width="16" height="8" fill="#8b7355"/>
    <!-- Upper part of geta -->
    <rect x="6" y="32" width="12" height="8" fill="#a0826d"/>
    <!-- Accent stripe -->
    <rect x="6" y="34" width="12" height="2" fill="#9b9285"/>
    <!-- Detail -->
    <rect x="8" y="30" width="8" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Right slipper base (wood) -->
  <g id="right-slipper">
    <!-- Sole -->
    <rect x="44" y="40" width="16" height="8" fill="#8b7355"/>
    <!-- Upper part of geta -->
    <rect x="46" y="32" width="12" height="8" fill="#a0826d"/>
    <!-- Accent stripe -->
    <rect x="46" y="34" width="12" height="2" fill="#9b9285"/>
    <!-- Detail -->
    <rect x="48" y="30" width="8" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Left small bonsai pot decoration -->
  <g id="left-bonsai">
    <!-- Pot -->
    <rect x="8" y="20" width="6" height="6" fill="#c4845c"/>
    <!-- Pot rim -->
    <rect x="7" y="19" width="8" height="1" fill="#9b9285"/>
    <!-- Tree foliage -->
    <rect x="9" y="16" width="4" height="4" fill="#4a7c3c"/>
    <!-- Tree highlight -->
    <rect x="10" y="17" width="2" height="2" fill="#6aa858"/>
  </g>
  
  <!-- Right small bonsai pot decoration -->
  <g id="right-bonsai">
    <!-- Pot -->
    <rect x="50" y="20" width="6" height="6" fill="#c4845c"/>
    <!-- Pot rim -->
    <rect x="49" y="19" width="8" height="1" fill="#9b9285"/>
    <!-- Tree foliage -->
    <rect x="51" y="16" width="4" height="4" fill="#4a7c3c"/>
    <!-- Tree highlight -->
    <rect x="52" y="17" width="2" height="2" fill="#6aa858"/>
  </g>
  
  <!-- Frame border (rarity indicator) -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#9b9285" stroke-width="2"/>
  
</svg>