<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Okonomiyaki Chef Geta</title>
  
  <!-- Left Geta -->
  <g id="left-geta">
    <!-- Sole base -->
    <rect x="4" y="40" width="20" height="12" fill="#8b7355"/>
    <!-- Sole top (wood grain) -->
    <rect x="4" y="40" width="20" height="4" fill="#a0826d"/>
    <!-- Thong fabric left -->
    <rect x="8" y="36" width="4" height="8" fill="#d4463f"/>
    <!-- Thong fabric right -->
    <rect x="16" y="36" width="4" height="8" fill="#d4463f"/>
    <!-- Frame accent top -->
    <rect x="4" y="40" width="20" height="2" fill="#9b9285"/>
    <!-- Decorative band -->
    <rect x="6" y="44" width="16" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Right Geta -->
  <g id="right-geta">
    <!-- Sole base -->
    <rect x="40" y="40" width="20" height="12" fill="#8b7355"/>
    <!-- Sole top (wood grain) -->
    <rect x="40" y="40" width="20" height="4" fill="#a0826d"/>
    <!-- Thong fabric left -->
    <rect x="44" y="36" width="4" height="8" fill="#d4463f"/>
    <!-- Thong fabric right -->
    <rect x="52" y="36" width="4" height="8" fill="#d4463f"/>
    <!-- Frame accent top -->
    <rect x="40" y="40" width="20" height="2" fill="#9b9285"/>
    <!-- Decorative band -->
    <rect x="42" y="44" width="16" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Heat effect detail (cooking theme) -->
  <rect x="10" y="32" width="2" height="4" fill="#ff6b35"/>
  <rect x="52" y="32" width="2" height="4" fill="#ff6b35"/>
  
  <!-- Okonomiyaki sauce drip indicator -->
  <rect x="18" y="48" width="2" height="2" fill="#8b4513"/>
  <rect x="46" y="48" width="2" height="2" fill="#8b4513"/>
</svg>