<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Shuri Castle Sandals</title>
  
  <!-- Left sandal -->
  <g id="left-sandal">
    <!-- Sole -->
    <rect x="4" y="36" width="16" height="8" fill="#8B4513"/>
    <rect x="4" y="36" width="16" height="2" fill="#A0522D"/>
    
    <!-- Sandal band top -->
    <rect x="8" y="32" width="8" height="4" fill="#a056d2"/>
    <rect x="8" y="32" width="8" height="1" fill="#d4a5ff"/>
    
    <!-- Sandal straps -->
    <rect x="10" y="28" width="2" height="4" fill="#8B4513"/>
    <rect x="14" y="28" width="2" height="4" fill="#8B4513"/>
    
    <!-- Decorative ornament -->
    <rect x="10" y="24" width="4" height="2" fill="#FFD700"/>
    <rect x="11" y="23" width="2" height="1" fill="#FFA500"/>
  </g>
  
  <!-- Right sandal -->
  <g id="right-sandal">
    <!-- Sole -->
    <rect x="44" y="36" width="16" height="8" fill="#8B4513"/>
    <rect x="44" y="36" width="16" height="2" fill="#A0522D"/>
    
    <!-- Sandal band top -->
    <rect x="48" y="32" width="8" height="4" fill="#a056d2"/>
    <rect x="48" y="32" width="8" height="1" fill="#d4a5ff"/>
    
    <!-- Sandal straps -->
    <rect x="50" y="28" width="2" height="4" fill="#8B4513"/>
    <rect x="54" y="28" width="2" height="4" fill="#8B4513"/>
    
    <!-- Decorative ornament -->
    <rect x="50" y="24" width="4" height="2" fill="#FFD700"/>
    <rect x="51" y="23" width="2" height="1" fill="#FFA500"/>
  </g>
  
  <!-- Epic rarity frame accent -->
  <g id="frame" opacity="0.4">
    <rect x="2" y="20" width="28" height="32" fill="none" stroke="#a056d2" stroke-width="1"/>
    <rect x="34" y="20" width="28" height="32" fill="none" stroke="#a056d2" stroke-width="1"/>
  </g>
</svg>