<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Yakushima Cedar Sandals</title>
  
  <!-- Left sandal -->
  <g id="left-sandal">
    <!-- Sole -->
    <rect x="4" y="36" width="16" height="12" fill="#8B6F47"/>
    <!-- Wood grain detail -->
    <rect x="4" y="36" width="16" height="2" fill="#6B5437"/>
    <rect x="4" y="40" width="16" height="2" fill="#6B5437"/>
    <rect x="4" y="44" width="16" height="2" fill="#6B5437"/>
    <!-- Straps -->
    <rect x="8" y="32" width="2" height="6" fill="#4d8fbf"/>
    <rect x="14" y="32" width="2" height="6" fill="#4d8fbf"/>
    <!-- Strap connectors -->
    <rect x="8" y="32" width="8" height="2" fill="#4d8fbf"/>
  </g>
  
  <!-- Right sandal -->
  <g id="right-sandal">
    <!-- Sole -->
    <rect x="44" y="36" width="16" height="12" fill="#8B6F47"/>
    <!-- Wood grain detail -->
    <rect x="44" y="36" width="16" height="2" fill="#6B5437"/>
    <rect x="44" y="40" width="16" height="2" fill="#6B5437"/>
    <rect x="44" y="44" width="16" height="2" fill="#6B5437"/>
    <!-- Straps -->
    <rect x="48" y="32" width="2" height="6" fill="#4d8fbf"/>
    <rect x="54" y="32" width="2" height="6" fill="#4d8fbf"/>
    <!-- Strap connectors -->
    <rect x="48" y="32" width="8" height="2" fill="#4d8fbf"/>
  </g>
  
  <!-- Frame/border accent -->
  <rect x="2" y="30" width="60" height="22" fill="none" stroke="#4d8fbf" stroke-width="1"/>
  
</svg>