<rect x="8" y="40" width="20" height="12" fill="#8b7355"/>
<!-- Left sandal strap -->
<rect x="10" y="38" width="16" height="4" fill="#9b9285"/>
<!-- Left sandal toe post -->
<rect x="14" y="52" width="4" height="4" fill="#6b5345"/>
