<rect x="12" y="28" width="4" height="4" fill="#d63031"/>
<rect x="12" y="32" width="4" height="4" fill="#c92a2a"/>
<rect x="16" y="30" width="4" height="4" fill="#d63031"/>
<!-- Left leaf -->
