<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Tea Picker Hat</title>
  
  <!-- Brim outer edge -->
  <rect x="4" y="20" width="56" height="4" fill="#9b9285"/>
  
  <!-- Brim main -->
  <rect x="8" y="24" width="48" height="8" fill="#d4c4a8"/>
  
  <!-- Crown left side -->
  <rect x="12" y="16" width="4" height="8" fill="#9b9285"/>
  
  <!-- Crown center-left -->
  <rect x="16" y="12" width="4" height="12" fill="#b8a878"/>
  
  <!-- Crown center -->
  <rect x="20" y="8" width="24" height="16" fill="#c9b896"/>
  
  <!-- Crown center-right -->
  <rect x="44" y="12" width="4" height="12" fill="#b8a878"/>
  
  <!-- Crown right side -->
  <rect x="48" y="16" width="4" height="8" fill="#9b9285"/>
  
  <!-- Peak/ridge top -->
  <rect x="24" y="4" width="16" height="4" fill="#a89968"/>
  
  <!-- Chin strap left -->
  <rect x="12" y="32" width="4" height="4" fill="#9b9285"/>
  
  <!-- Chin strap right -->
  <rect x="52" y="32" width="4" height="4" fill="#9b9285"/>
  
  <!-- Tea leaf accent left -->
  <rect x="20" y="28" width="4" height="4" fill="#6b8e3d"/>
  
  <!-- Tea leaf accent right -->
  <rect x="40" y="28" width="4" height="4" fill="#6b8e3d"/>
  
</svg>