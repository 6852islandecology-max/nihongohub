<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Ninja Hood</title>
  <g id="ninja-hood">
    <!-- Epic frame border -->
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="2"/>
    
    <!-- Hood main body - dark fabric -->
    <rect x="12" y="12" width="40" height="28" fill="#1a1a2e"/>
    
    <!-- Hood top curve -->
    <rect x="16" y="8" width="32" height="4" fill="#1a1a2e"/>
    <rect x="14" y="10" width="4" height="2" fill="#1a1a2e"/>
    <rect x="46" y="10" width="4" height="2" fill="#1a1a2e"/>
    
    <!-- Face opening shadow - dark inner -->
    <rect x="20" y="20" width="24" height="16" fill="#0d0d1a"/>
    
    <!-- Eye slots left -->
    <rect x="22" y="22" width="6" height="4" fill="#2a2a3e"/>
    
    <!-- Eye slots right -->
    <rect x="36" y="22" width="6" height="4" fill="#2a2a3e"/>
    
    <!-- Center face mask - lighter shade for fabric separation -->
    <rect x="28" y="26" width="8" height="8" fill="#2a2a3e"/>
    
    <!-- Chin section -->
    <rect x="16" y="36" width="32" height="8" fill="#1a1a2e"/>
    
    <!-- Side ties/cords -->
    <rect x="10" y="30" width="4" height="4" fill="#4a3a5a"/>
    <rect x="50" y="30" width="4" height="4" fill="#4a3a5a"/>
    
    <!-- Accent emblem - purple diamond on chest -->
    <rect x="28" y="40" width="4" height="2" fill="#a056d2"/>
    <rect x="26" y="42" width="8" height="2" fill="#a056d2"/>
    <rect x="28" y="44" width="4" height="2" fill="#a056d2"/>
    
    <!-- Fabric texture lines -->
    <rect x="20" y="16" width="2" height="20" fill="#2a2a3e" opacity="0.5"/>
    <rect x="42" y="16" width="2" height="20" fill="#2a2a3e" opacity="0.5"/>
  </g>
</svg>