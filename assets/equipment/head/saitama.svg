<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Edo Komon Helm</title>
  <g id="helm">
    <!-- Outer frame border -->
    <rect x="12" y="8" width="40" height="4" fill="#9b9285"/>
    <!-- Top crest -->
    <rect x="28" y="4" width="8" height="4" fill="#9b9285"/>
    <!-- Left side plate -->
    <rect x="8" y="12" width="4" height="24" fill="#9b9285"/>
    <!-- Right side plate -->
    <rect x="52" y="12" width="4" height="24" fill="#9b9285"/>
    <!-- Main helm body dark -->
    <rect x="12" y="12" width="40" height="20" fill="#2d2416"/>
    <!-- Fine pattern - small dye marks left -->
    <rect x="16" y="16" width="4" height="4" fill="#5a4a3a"/>
    <rect x="16" y="24" width="4" height="4" fill="#5a4a3a"/>
    <!-- Fine pattern - center -->
    <rect x="28" y="16" width="8" height="4" fill="#5a4a3a"/>
    <rect x="28" y="24" width="8" height="4" fill="#5a4a3a"/>
    <!-- Fine pattern - right -->
    <rect x="44" y="16" width="4" height="4" fill="#5a4a3a"/>
    <rect x="44" y="24" width="4" height="4" fill="#5a4a3a"/>
    <!-- Face opening outline -->
    <rect x="20" y="28" width="24" height="8" fill="#1a1410"/>
    <!-- Gold accent trim under face -->
    <rect x="12" y="36" width="40" height="4" fill="#d4af37"/>
    <!-- Bottom guard left -->
    <rect x="12" y="40" width="16" height="8" fill="#9b9285"/>
    <!-- Bottom guard right -->
    <rect x="36" y="40" width="16" height="8" fill="#9b9285"/>
    <!-- Center chin guard -->
    <rect x="28" y="40" width="8" height="12" fill="#2d2416"/>
  </g>
</svg>