<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Akashi Octopus Helm</title>
  
  <!-- Rare frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  </g>
  
  <!-- Main helm body (octopus head) - dark purple/navy -->
  <g id="helm_body">
    <rect x="20" y="12" width="24" height="20" fill="#2c1b4e"/>
    <rect x="16" y="16" width="4" height="12" fill="#2c1b4e"/>
    <rect x="44" y="16" width="4" height="12" fill="#2c1b4e"/>
  </g>
  
  <!-- Octopus dome top -->
  <g id="dome">
    <rect x="20" y="8" width="4" height="4" fill="#3d2a5c"/>
    <rect x="24" y="4" width="16" height="8" fill="#3d2a5c"/>
    <rect x="40" y="8" width="4" height="4" fill="#3d2a5c"/>
  </g>
  
  <!-- Eyes (large and prominent) -->
  <g id="eyes">
    <rect x="24" y="20" width="4" height="4" fill="#4d8fbf"/>
    <rect x="28" y="20" width="2" height="2" fill="#ffffff"/>
    <rect x="36" y="20" width="4" height="4" fill="#4d8fbf"/>
    <rect x="38" y="20" width="2" height="2" fill="#ffffff"/>
  </g>
  
  <!-- Mouth/suction cups detail -->
  <g id="mouth">
    <rect x="28" y="28" width="8" height="2" fill="#4d8fbf"/>
  </g>
  
  <!-- Tentacles - curling down left -->
  <g id="tentacle_left">
    <rect x="12" y="28" width="4" height="4" fill="#2c1b4e"/>
    <rect x="8" y="32" width="4" height="4" fill="#3d2a5c"/>
    <rect x="8" y="36" width="4" height="4" fill="#2c1b4e"/>
    <rect x="12" y="40" width="4" height="4" fill="#3d2a5c"/>
  </g>
  
  <!-- Tentacles - curling down right -->
  <g id="tentacle_right">
    <rect x="48" y="28" width="4" height="4" fill="#2c1b4e"/>
    <rect x="52" y="32" width="4" height="4" fill="#3d2a5c"/>
    <rect x="52" y="36" width="4" height="4" fill="#2c1b4e"/>
    <rect x="48" y="40" width="4" height="4" fill="#3d2a5c"/>
  </g>
  
  <!-- Center tentacle accent -->
  <g id="tentacle_center">
    <rect x="28" y="32" width="8" height="4" fill="#4d8fbf"/>
    <rect x="28" y="36" width="8" height="4" fill="#3d2a5c"/>
  </g>
  
  <!-- Suction cup details on tentacles -->
  <g id="suction_cups">
    <rect x="10" y="44" width="2" height="2" fill="#4d8fbf"/>
    <rect x="14" y="44" width="2" height="2" fill="#4d8fbf"/>
    <rect x="50" y="44" width="2" height="2" fill="#4d8fbf"/>
    <rect x="54" y="44" width="2" height="2" fill="#4d8fbf"/>
  </g>
</svg>