<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Gujo Odori Hat</title>
  
  <!-- Outer frame border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="4"/>
  
  <!-- Hat brim - light straw color -->
  <rect x="8" y="20" width="48" height="8" fill="#d4c5a9"/>
  
  <!-- Brim shading -->
  <rect x="8" y="20" width="48" height="2" fill="#c9b896"/>
  
  <!-- Hat crown - main straw -->
  <rect x="16" y="12" width="32" height="12" fill="#dcc9a8"/>
  
  <!-- Crown shading left -->
  <rect x="16" y="12" width="4" height="12" fill="#c9b896"/>
  
  <!-- Crown highlight right -->
  <rect x="44" y="12" width="4" height="12" fill="#e8d9bc"/>
  
  <!-- Top of crown rounded effect -->
  <rect x="20" y="8" width="24" height="4" fill="#dcc9a8"/>
  <rect x="24" y="4" width="16" height="4" fill="#d4c5a9"/>
  
  <!-- Hat apex -->
  <rect x="28" y="0" width="8" height="4" fill="#c9b896"/>
  
  <!-- Band around crown -->
  <rect x="16" y="22" width="32" height="2" fill="#9b9285"/>
  
  <!-- Band detail -->
  <rect x="16" y="24" width="32" height="2" fill="#a89b87"/>
  
  <!-- Face opening shadow -->
  <rect x="20" y="26" width="24" height="8" fill="#9d8e78"/>
  
  <!-- Inner face area lighter -->
  <rect x="22" y="28" width="20" height="6" fill="#b5a693"/>
  
  <!-- Chin/neck opening -->
  <rect x="24" y="34" width="16" height="4" fill="#c9b896"/>
  
  <!-- Side tie details left -->
  <rect x="12" y="30" width="2" height="6" fill="#9b9285"/>
  
  <!-- Side tie details right -->
  <rect x="50" y="30" width="2" height="6" fill="#9b9285"/>
  
</svg>