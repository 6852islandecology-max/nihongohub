<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<title>Maiko Wig Crown</title>
<g id="maiko-wig-crown">
<!-- Gold frame border -->
<rect x="12" y="4" width="40" height="4" fill="#e0a634"/>
<rect x="8" y="8" width="48" height="4" fill="#e0a634"/>
<rect x="8" y="36" width="48" height="4" fill="#e0a634"/>
<!-- Left and right gold borders -->
<rect x="8" y="8" width="4" height="28" fill="#e0a634"/>
<rect x="52" y="8" width="4" height="28" fill="#e0a634"/>
<!-- Black lacquered main wig body -->
<rect x="12" y="12" width="40" height="24" fill="#1a1a1a"/>
<!-- Dark red lacquer accent -->
<rect x="16" y="16" width="32" height="16" fill="#4a2020"/>
<!-- Gold ornamental top knots (left) -->
<rect x="16" y="8" width="4" height="4" fill="#e0a634"/>
<rect x="20" y="4" width="4" height="4" fill="#e0a634"/>
<!-- Gold ornamental top knots (right) -->
<rect x="40" y="8" width="4" height="4" fill="#e0a634"/>
<rect x="44" y="4" width="4" height="4" fill="#e0a634"/>
<!-- Central ornament -->
<rect x="30" y="6" width="4" height="4" fill="#e0a634"/>
<rect x="28" y="10" width="8" height="4" fill="#e0a634"/>
<!-- Hair highlight shadows -->
<rect x="20" y="20" width="4" height="8" fill="#2a2a2a"/>
<rect x="40" y="20" width="4" height="8" fill="#2a2a2a"/>
<!-- Silk fabric bottom trim -->
<rect x="12" y="40" width="40" height="8" fill="#b8860b"/>
<!-- Decorative pins/ornaments -->
<rect x="24" y="36" width="4" height="4" fill="#e0a634"/>
<rect x="36" y="36" width="4" height="4" fill="#e0a634"/>
</g>
</svg>