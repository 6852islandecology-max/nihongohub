<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Yoshinogari Bronze Crown</title>
  
  <!-- Frame border (epic rarity) -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="2"/>
  
  <!-- Bronze crown base - main arc -->
  <rect x="16" y="12" width="4" height="4" fill="#8b6f47"/>
  <rect x="20" y="8" width="4" height="4" fill="#a0826d"/>
  <rect x="24" y="8" width="4" height="4" fill="#b8956a"/>
  <rect x="28" y="8" width="4" height="4" fill="#b8956a"/>
  <rect x="32" y="8" width="4" height="4" fill="#b8956a"/>
  <rect x="36" y="8" width="4" height="4" fill="#b8956a"/>
  <rect x="40" y="8" width="4" height="4" fill="#a0826d"/>
  <rect x="44" y="12" width="4" height="4" fill="#8b6f47"/>
  
  <!-- Upper crown ridge -->
  <rect x="20" y="12" width="4" height="4" fill="#c9a876"/>
  <rect x="24" y="12" width="4" height="4" fill="#d4b896"/>
  <rect x="28" y="12" width="4" height="4" fill="#d4b896"/>
  <rect x="32" y="12" width="4" height="4" fill="#d4b896"/>
  <rect x="36" y="12" width="4" height="4" fill="#c9a876"/>
  
  <!-- Mid crown body -->
  <rect x="16" y="16" width="4" height="4" fill="#a0826d"/>
  <rect x="20" y="16" width="4" height="4" fill="#c9a876"/>
  <rect x="24" y="16" width="4" height="4" fill="#d4b896"/>
  <rect x="32" y="16" width="4" height="4" fill="#d4b896"/>
  <rect x="36" y="16" width="4" height="4" fill="#c9a876"/>
  <rect x="40" y="16" width="4" height="4" fill="#a0826d"/>
  <rect x="44" y="16" width="4" height="4" fill="#8b6f47"/>
  
  <!-- Lower crown -->
  <rect x="16" y="20" width="4" height="4" fill="#8b6f47"/>
  <rect x="20" y="20" width="4" height="4" fill="#a0826d"/>
  <rect x="24" y="20" width="4" height="4" fill="#b8956a"/>
  <rect x="32" y="20" width="4" height="4" fill="#b8956a"/>
  <rect x="36" y="20" width="4" height="4" fill="#a0826d"/>
  <rect x="40" y="20" width="4" height="4" fill="#8b6f47"/>
  
  <!-- Face plate area (dark bronze) -->
  <rect x="20" y="24" width="4" height="4" fill="#6b5d52"/>
  <rect x="24" y="24" width="8" height="4" fill="#5a4f47"/>
  <rect x="32" y="24" width="4" height="4" fill="#6b5d52"/>
  
  <rect x="20" y="28" width="4" height="4" fill="#7a6d62"/>
  <rect x="24" y="28" width="8" height="4" fill="#6b5d52"/>
  <rect x="32" y="28" width="4" height="4" fill="#7a6d62"/>
  
  <!-- Ornamental accent lines (gold-ish) -->
  <rect x="28" y="24" width="4" height="4" fill="#e8d5b7"/>
  
  <!-- Side bands -->
  <rect x="12" y="20" width="4" height="8" fill="#8b6f47"/>
  <rect x="48" y="20" width="4" height="8" fill="#8b6f47"/>
</svg>