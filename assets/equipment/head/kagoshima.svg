<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Satsuma Samurai Helm</title>
  
  <!-- Gold accent border -->
  <rect x="12" y="8" width="40" height="4" fill="#d4af37"/>
  
  <!-- Main helm body - dark iron -->
  <rect x="12" y="12" width="8" height="4" fill="#2a2a2a"/>
  <rect x="20" y="12" width="24" height="4" fill="#2a2a2a"/>
  <rect x="44" y="12" width="8" height="4" fill="#2a2a2a"/>
  
  <!-- Upper face plate -->
  <rect x="16" y="16" width="4" height="4" fill="#a056d2"/>
  <rect x="20" y="16" width="24" height="4" fill="#3a3a3a"/>
  <rect x="44" y="16" width="4" height="4" fill="#a056d2"/>
  
  <!-- Mid helm - purple accent stripes -->
  <rect x="12" y="20" width="4" height="8" fill="#a056d2"/>
  <rect x="16" y="20" width="32" height="8" fill="#3a3a3a"/>
  <rect x="48" y="20" width="4" height="8" fill="#a056d2"/>
  
  <!-- Face opening - darker interior -->
  <rect x="20" y="24" width="8" height="8" fill="#1a1a1a"/>
  <rect x="28" y="24" width="8" height="8" fill="#1a1a1a"/>
  <rect x="36" y="24" width="8" height="8" fill="#1a1a1a"/>
  
  <!-- Lower face guard detail -->
  <rect x="16" y="32" width="4" height="4" fill="#a056d2"/>
  <rect x="20" y="32" width="24" height="4" fill="#4a4a4a"/>
  <rect x="44" y="32" width="4" height="4" fill="#a056d2"/>
  
  <!-- Bottom guard flare -->
  <rect x="12" y="36" width="4" height="4" fill="#2a2a2a"/>
  <rect x="16" y="36" width="32" height="4" fill="#3a3a3a"/>
  <rect x="48" y="36" width="4" height="4" fill="#2a2a2a"/>
  
  <!-- Side face guards (fukikaeshi) -->
  <rect x="8" y="28" width="4" height="12" fill="#2a2a2a"/>
  <rect x="52" y="28" width="4" height="12" fill="#2a2a2a"/>
  
  <!-- Gold trim bottom -->
  <rect x="12" y="40" width="40" height="4" fill="#d4af37"/>
  
  <!-- Small accent dots - clan marker -->
  <rect x="28" y="44" width="4" height="4" fill="#a056d2"/>
  <rect x="32" y="44" width="4" height="4" fill="#a056d2"/>
</svg>