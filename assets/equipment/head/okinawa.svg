<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Shisa Lion Helm</title>
  
  <!-- Main helm structure -->
  <g id="helm">
    <!-- Left ear -->
    <rect x="8" y="8" width="4" height="4" fill="#a056d2"/>
    <rect x="4" y="12" width="4" height="4" fill="#a056d2"/>
    <rect x="8" y="12" width="4" height="4" fill="#d4a574"/>
    
    <!-- Right ear -->
    <rect x="52" y="8" width="4" height="4" fill="#a056d2"/>
    <rect x="56" y="12" width="4" height="4" fill="#a056d2"/>
    <rect x="52" y="12" width="4" height="4" fill="#d4a574"/>
    
    <!-- Top crest -->
    <rect x="28" y="4" width="8" height="4" fill="#a056d2"/>
    <rect x="24" y="8" width="4" height="4" fill="#a056d2"/>
    <rect x="36" y="8" width="4" height="4" fill="#a056d2"/>
    
    <!-- Main face plate -->
    <rect x="16" y="16" width="32" height="20" fill="#d4a574"/>
    
    <!-- Face plate border -->
    <rect x="16" y="16" width="32" height="4" fill="#a056d2"/>
    <rect x="16" y="32" width="32" height="4" fill="#a056d2"/>
    <rect x="16" y="16" width="4" height="20" fill="#a056d2"/>
    <rect x="44" y="16" width="4" height="20" fill="#a056d2"/>
    
    <!-- Left eye -->
    <rect x="20" y="20" width="4" height="4" fill="#2a1810"/>
    <rect x="22" y="20" width="2" height="2" fill="#ffffff"/>
    
    <!-- Right eye -->
    <rect x="40" y="20" width="4" height="4" fill="#2a1810"/>
    <rect x="40" y="20" width="2" height="2" fill="#ffffff"/>
    
    <!-- Nose -->
    <rect x="30" y="24" width="4" height="4" fill="#2a1810"/>
    
    <!-- Mouth - fierce expression -->
    <rect x="24" y="28" width="4" height="4" fill="#2a1810"/>
    <rect x="36" y="28" width="4" height="4" fill="#2a1810"/>
    
    <!-- Fangs accent -->
    <rect x="28" y="28" width="2" height="2" fill="#ffffff"/>
    <rect x="34" y="28" width="2" height="2" fill="#ffffff"/>
    
    <!-- Jaw guard -->
    <rect x="20" y="36" width="24" height="4" fill="#8b6f47"/>
    <rect x="16" y="40" width="32" height="4" fill="#a056d2"/>
    
    <!-- Chin guard detail -->
    <rect x="24" y="44" width="16" height="4" fill="#8b6f47"/>
  </g>
</svg>