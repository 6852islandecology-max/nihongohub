<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Bizen Pottery Helm</title>
  
  <!-- Main helm body - earthen brown -->
  <g id="helm">
    <!-- Top dome -->
    <rect x="20" y="8" width="24" height="4" fill="#8B6F47"/>
    <rect x="16" y="12" width="32" height="4" fill="#9D7E52"/>
    <rect x="12" y="16" width="40" height="4" fill="#8B6F47"/>
    
    <!-- Main face plate -->
    <rect x="12" y="20" width="40" height="16" fill="#A0826D"/>
    <rect x="12" y="20" width="40" height="2" fill="#4d8fbf"/>
    
    <!-- Left side plate -->
    <rect x="8" y="24" width="4" height="12" fill="#8B6F47"/>
    <rect x="8" y="24" width="4" height="2" fill="#4d8fbf"/>
    
    <!-- Right side plate -->
    <rect x="52" y="24" width="4" height="12" fill="#8B6F47"/>
    <rect x="52" y="24" width="4" height="2" fill="#4d8fbf"/>
    
    <!-- Face opening - dark -->
    <rect x="20" y="24" width="24" height="8" fill="#5C4A3D"/>
    
    <!-- Eye slots -->
    <rect x="24" y="26" width="4" height="4" fill="#2C2416"/>
    <rect x="36" y="26" width="4" height="4" fill="#2C2416"/>
    
    <!-- Nose guard -->
    <rect x="30" y="30" width="4" height="2" fill="#5C4A3D"/>
    
    <!-- Cheek guards -->
    <rect x="16" y="28" width="4" height="8" fill="#9D7E52"/>
    <rect x="44" y="28" width="4" height="8" fill="#9D7E52"/>
    
    <!-- Bottom rim -->
    <rect x="12" y="36" width="40" height="4" fill="#7A6340"/>
    <rect x="12" y="36" width="40" height="1" fill="#4d8fbf"/>
    
    <!-- Neck guard flare -->
    <rect x="14" y="40" width="36" height="4" fill="#8B6F47"/>
    
    <!-- Texture detail lines -->
    <rect x="18" y="22" width="2" height="12" fill="#6B5A4D" opacity="0.4"/>
    <rect x="44" y="22" width="2" height="12" fill="#6B5A4D" opacity="0.4"/>
  </g>
</svg>