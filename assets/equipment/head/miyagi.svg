<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Crescent Moon Helm</title>
  
  <!-- Purple epic frame border -->
  <rect x="8" y="4" width="48" height="56" fill="none" stroke="#a056d2" stroke-width="2"/>
  
  <!-- Main helm body - dark steel -->
  <rect x="16" y="12" width="32" height="28" fill="#2a2a3e"/>
  
  <!-- Helm top curve -->
  <rect x="16" y="8" width="32" height="4" fill="#2a2a3e"/>
  <rect x="12" y="12" width="4" height="4" fill="#2a2a3e"/>
  <rect x="52" y="12" width="4" height="4" fill="#2a2a3e"/>
  
  <!-- Left crescent moon crest - light purple/silver -->
  <rect x="12" y="16" width="4" height="4" fill="#d4a5e8"/>
  <rect x="8" y="20" width="4" height="4" fill="#d4a5e8"/>
  <rect x="8" y="24" width="4" height="4" fill="#d4a5e8"/>
  <rect x="12" y="28" width="4" height="4" fill="#d4a5e8"/>
  
  <!-- Right crescent moon crest - light purple/silver (mirror) -->
  <rect x="48" y="16" width="4" height="4" fill="#d4a5e8"/>
  <rect x="52" y="20" width="4" height="4" fill="#d4a5e8"/>
  <rect x="52" y="24" width="4" height="4" fill="#d4a5e8"/>
  <rect x="48" y="28" width="4" height="4" fill="#d4a5e8"/>
  
  <!-- Center crescent accent - bright gold -->
  <rect x="28" y="8" width="8" height="4" fill="#f0c83a"/>
  <rect x="24" y="12" width="4" height="4" fill="#f0c83a"/>
  <rect x="36" y="12" width="4" height="4" fill="#f0c83a"/>
  
  <!-- Helm detail ridges -->
  <rect x="20" y="20" width="4" height="12" fill="#4a4a5e"/>
  <rect x="40" y="20" width="4" height="12" fill="#4a4a5e"/>
  
  <!-- Center vertical ridge -->
  <rect x="30" y="16" width="4" height="16" fill="#4a4a5e"/>
  
  <!-- Face opening area - dark -->
  <rect x="20" y="32" width="24" height="12" fill="#1a1a2e"/>
  
  <!-- Face opening detail -->
  <rect x="24" y="36" width="4" height="4" fill="#3a3a4e"/>
  <rect x="36" y="36" width="4" height="4" fill="#3a3a4e"/>
  
  <!-- Lower guard plate -->
  <rect x="16" y="44" width="32" height="8" fill="#3a3a4e"/>
  <rect x="16" y="48" width="32" height="4" fill="#a056d2"/>
  
</svg>