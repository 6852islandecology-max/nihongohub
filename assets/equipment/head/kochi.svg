<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<title>Yosakoi Headband</title>
<g id="headband">
<!-- Frame/Border -->
<rect x="8" y="16" width="48" height="4" fill="#4d8fbf"/>
<rect x="8" y="28" width="48" height="4" fill="#4d8fbf"/>
<rect x="8" y="16" width="4" height="16" fill="#4d8fbf"/>
<rect x="52" y="16" width="4" height="16" fill="#4d8fbf"/>

<!-- Main band fabric - white -->
<rect x="12" y="20" width="40" height="8" fill="#ffffff"/>

<!-- Decorative pattern - red stripes (Yosakai traditional) -->
<rect x="16" y="20" width="4" height="8" fill="#e63946"/>
<rect x="28" y="20" width="4" height="8" fill="#e63946"/>
<rect x="40" y="20" width="4" height="8" fill="#e63946"/>

<!-- Gold accent details -->
<rect x="12" y="18" width="40" height="2" fill="#d4af37"/>
<rect x="12" y="26" width="40" height="2" fill="#d4af37"/>

<!-- Side knots/ties - dark blue -->
<rect x="4" y="20" width="4" height="8" fill="#1a3a52"/>
<rect x="56" y="20" width="4" height="8" fill="#1a3a52"/>

<!-- Shine highlight -->
<rect x="20" y="21" width="24" height="2" fill="#f0f0f0"/>
</g>
</svg>