<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Natto Straw Hat</title>
  
  <!-- Hat brim - light straw color -->
  <rect x="4" y="20" width="56" height="4" fill="#d4c5a9"/>
  
  <!-- Brim shading -->
  <rect x="8" y="24" width="48" height="2" fill="#c9b896"/>
  
  <!-- Main hat crown - medium straw -->
  <rect x="12" y="12" width="40" height="12" fill="#d9cbb5"/>
  
  <!-- Crown darker shading -->
  <rect x="14" y="12" width="36" height="2" fill="#c9b896"/>
  <rect x="16" y="14" width="32" height="2" fill="#bfa880"/>
  
  <!-- Hat top point/peak -->
  <rect x="28" y="8" width="8" height="4" fill="#d4c5a9"/>
  <rect x="30" y="4" width="4" height="4" fill="#c9b896"/>
  
  <!-- Natto fermenting bundle detail - dark brown accent -->
  <rect x="20" y="14" width="4" height="6" fill="#6b5a47"/>
  <rect x="24" y="14" width="4" height="6" fill="#7a6b55"/>
  <rect x="40" y="14" width="4" height="6" fill="#7a6b55"/>
  <rect x="44" y="14" width="4" height="6" fill="#6b5a47"/>
  
  <!-- Binding cord - rarity frame color -->
  <rect x="10" y="20" width="44" height="2" fill="#9b9285"/>
  
  <!-- Left face shadow -->
  <rect x="12" y="20" width="2" height="2" fill="#9b9285"/>
  
  <!-- Right face shadow -->
  <rect x="50" y="20" width="2" height="2" fill="#9b9285"/>
  
  <!-- Small straw wisps detail - light accent -->
  <rect x="8" y="18" width="2" height="2" fill="#e5d9c3"/>
  <rect x="54" y="18" width="2" height="2" fill="#e5d9c3"/>
  <rect x="6" y="22" width="2" height="2" fill="#c9b896"/>
  <rect x="56" y="22" width="2" height="2" fill="#c9b896"/>
</svg>