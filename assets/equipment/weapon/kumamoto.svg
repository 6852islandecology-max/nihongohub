<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<title>Kumamoto Castle Spear</title>
<g id="spear">
<!-- Blade - golden tip -->
<rect x="24" y="4" width="4" height="4" fill="#ffd700"/>
<rect x="20" y="8" width="12" height="4" fill="#ffd700"/>
<rect x="20" y="12" width="12" height="4" fill="#ffed4e"/>
<!-- Blade - metal accents -->
<rect x="24" y="16" width="4" height="4" fill="#c0a080"/>
<!-- Shaft - dark wood -->
<rect x="28" y="20" width="4" height="20" fill="#8b4513"/>
<rect x="24" y="20" width="4" height="20" fill="#a0522d"/>
<rect x="32" y="20" width="4" height="20" fill="#8b4513"/>
<!-- Guard - purple ornate -->
<rect x="20" y="40" width="4" height="4" fill="#a056d2"/>
<rect x="24" y="40" width="8" height="4" fill="#a056d2"/>
<rect x="32" y="40" width="4" height="4" fill="#a056d2"/>
<!-- Grip - wrapped leather -->
<rect x="24" y="44" width="4" height="4" fill="#6b4423"/>
<rect x="28" y="44" width="4" height="4" fill="#8b5a3c"/>
<rect x="24" y="48" width="4" height="4" fill="#8b5a3c"/>
<rect x="28" y="48" width="4" height="4" fill="#6b4423"/>
<!-- Pommel - purple accent -->
<rect x="24" y="52" width="4" height="4" fill="#a056d2"/>
<rect x="28" y="52" width="4" height="4" fill="#7d3fa8"/>
<rect x="26" y="56" width="4" height="4" fill="#a056d2"/>
<!-- Blade detail lines -->
<rect x="26" y="8" width="2" height="4" fill="#e6c200"/>
<rect x="28" y="8" width="2" height="4" fill="#ffd700"/>
</g>
</svg>