<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Momotaro Sword</title>
  
  <!-- Handle/Grip (brown) -->
  <rect x="24" y="44" width="4" height="16" fill="#8b4513"/>
  <rect x="28" y="44" width="4" height="16" fill="#a0522d"/>
  <rect x="20" y="48" width="12" height="4" fill="#8b4513"/>
  
  <!-- Tsuba (crossguard - purple epic rarity) -->
  <rect x="16" y="40" width="4" height="4" fill="#a056d2"/>
  <rect x="20" y="36" width="4" height="8" fill="#a056d2"/>
  <rect x="24" y="36" width="8" height="4" fill="#a056d2"/>
  <rect x="32" y="36" width="4" height="8" fill="#a056d2"/>
  <rect x="36" y="40" width="4" height="4" fill="#a056d2"/>
  
  <!-- Blade (silver/steel) -->
  <rect x="26" y="8" width="4" height="28" fill="#e8e8e8"/>
  <rect x="24" y="12" width="2" height="20" fill="#c0c0c0"/>
  <rect x="30" y="12" width="2" height="20" fill="#c0c0c0"/>
  
  <!-- Blade edge highlight (peach/golden - momotaro theme) -->
  <rect x="26" y="8" width="2" height="28" fill="#ffd700"/>
  <rect x="28" y="8" width="2" height="28" fill="#ffb347"/>
  
  <!-- Blade tip (peach accent) -->
  <rect x="26" y="4" width="4" height="4" fill="#ff9999"/>
  
  <!-- Peach ornament on blade (thematic detail) -->
  <rect x="28" y="20" width="4" height="4" fill="#ff6b9d"/>
  <rect x="30" y="22" width="2" height="2" fill="#ffc0cb"/>
  
  <!-- Purple epic rarity frame accent on upper blade -->
  <rect x="24" y="16" width="1" height="12" fill="#a056d2"/>
  <rect x="39" y="16" width="1" height="12" fill="#a056d2"/>
</svg>