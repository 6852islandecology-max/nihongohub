<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Aizu Lacquer Bow</title>
  
  <!-- Bow frame accent border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  </g>
  
  <!-- Bow limbs (curved wood) - left limb -->
  <g id="left-limb">
    <rect x="16" y="8" width="4" height="8" fill="#8b6f47"/>
    <rect x="12" y="16" width="4" height="4" fill="#8b6f47"/>
    <rect x="8" y="24" width="4" height="8" fill="#8b6f47"/>
    <rect x="12" y="32" width="4" height="4" fill="#8b6f47"/>
    <rect x="16" y="36" width="4" height="8" fill="#8b6f47"/>
  </g>
  
  <!-- Bow limbs - right limb (mirrored) -->
  <g id="right-limb">
    <rect x="44" y="8" width="4" height="8" fill="#8b6f47"/>
    <rect x="48" y="16" width="4" height="4" fill="#8b6f47"/>
    <rect x="52" y="24" width="4" height="8" fill="#8b6f47"/>
    <rect x="48" y="32" width="4" height="4" fill="#8b6f47"/>
    <rect x="44" y="36" width="4" height="8" fill="#8b6f47"/>
  </g>
  
  <!-- Bow grip/handle (center) -->
  <g id="grip">
    <rect x="28" y="20" width="8" height="24" fill="#5a4a3a"/>
    <rect x="24" y="28" width="16" height="8" fill="#6b5b4b"/>
  </g>
  
  <!-- Lacquer shine detail -->
  <g id="lacquer">
    <rect x="28" y="22" width="8" height="2" fill="#d4af37"/>
    <rect x="30" y="32" width="4" height="1" fill="#d4af37"/>
  </g>
  
  <!-- Bowstring -->
  <g id="string">
    <rect x="20" y="12" width="1" height="40" fill="#2a2a2a"/>
    <rect x="43" y="12" width="1" height="40" fill="#2a2a2a"/>
    <rect x="21" y="15" width="22" height="1" fill="#3a3a3a"/>
    <rect x="21" y="48" width="22" height="1" fill="#3a3a3a"/>
  </g>
</svg>