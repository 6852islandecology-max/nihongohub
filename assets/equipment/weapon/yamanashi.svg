<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
<title>Mt Fuji Pilgrim Staff</title>
<g>
<!-- Staff shaft -->
<rect x="28" y="8" width="8" height="40" fill="#8b6f47"/>
<!-- Shaft accent stripe -->
<rect x="30" y="12" width="4" height="32" fill="#a9927a"/>
<!-- Top ornament - mountain peak -->
<rect x="24" y="4" width="16" height="4" fill="#a056d2"/>
<!-- Peak highlight -->
<rect x="28" y="4" width="8" height="2" fill="#c084f0"/>
<!-- Upper grip wrap -->
<rect x="24" y="40" width="16" height="3" fill="#a056d2"/>
<!-- Middle grip wrap -->
<rect x="24" y="45" width="16" height="2" fill="#8b4eb8"/>
<!-- Lower grip -->
<rect x="26" y="48" width="12" height="8" fill="#6b5344"/>
<!-- Grip detail lines -->
<rect x="26" y="50" width="12" height="1" fill="#5a4438"/>
<rect x="26" y="54" width="12" height="1" fill="#5a4438"/>
<!-- Staff ferule/base -->
<rect x="24" y="56" width="16" height="2" fill="#a056d2"/>
<!-- Base metal tip -->
<rect x="26" y="58" width="12" height="4" fill="#6b5344"/>
<!-- Tip shine -->
<rect x="28" y="58" width="8" height="1" fill="#8b6f47"/>
</g>
</svg>