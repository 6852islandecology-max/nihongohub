<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
<title>Nebuta Lantern Staff</title>
<g id="nebuta-staff">
<!-- Handle/Grip (brown wood) -->
<rect x="28" y="44" width="8" height="16" fill="#8B4513"/>
<rect x="24" y="40" width="16" height="4" fill="#A0522D"/>
<!-- Mid-shaft (dark wood) -->
<rect x="28" y="28" width="8" height="16" fill="#654321"/>
<!-- Lantern structure base (purple frame) -->
<rect x="20" y="12" width="24" height="4" fill="#a056d2"/>
<!-- Lantern top corners (purple) -->
<rect x="16" y="8" width="4" height="4" fill="#a056d2"/>
<rect x="44" y="8" width="4" height="4" fill="#a056d2"/>
<!-- Lantern sides (purple frame) -->
<rect x="16" y="12" width="4" height="12" fill="#a056d2"/>
<rect x="44" y="12" width="4" height="12" fill="#a056d2"/>
<!-- Lantern bottom frame (purple) -->
<rect x="20" y="24" width="24" height="4" fill="#a056d2"/>
<!-- Lantern interior glow (orange-yellow flame) -->
<rect x="20" y="16" width="8" height="8" fill="#FF8C00"/>
<rect x="28" y="14" width="8" height="10" fill="#FFD700"/>
<rect x="36" y="16" width="8" height="8" fill="#FF6347"/>
<!-- Inner flame highlights (bright yellow) -->
<rect x="24" y="18" width="4" height="4" fill="#FFFF00"/>
<rect x="32" y="16" width="4" height="4" fill="#FFFF00"/>
<rect x="40" y="18" width="4" height="4" fill="#FFFF00"/>
<!-- Top ornament (purple star-like accent) -->
<rect x="28" y="4" width="8" height="4" fill="#a056d2"/>
<rect x="24" y="6" width="4" height="2" fill="#a056d2"/>
<rect x="36" y="6" width="4" height="2" fill="#a056d2"/>
</g>
</svg>