<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Kanazawa Gold-leaf Katana</title>
  <g id="katana">
    <!-- Handle/Tsuka (dark red) -->
    <rect x="28" y="44" width="8" height="16" fill="#8b3a3a"/>
    <!-- Tsuka wrapping detail (gold accent) -->
    <rect x="28" y="48" width="8" height="2" fill="#e0a634"/>
    <rect x="28" y="54" width="8" height="2" fill="#e0a634"/>
    <!-- Guard/Tsuba (gold frame) -->
    <rect x="24" y="42" width="16" height="4" fill="#e0a634"/>
    <rect x="26" y="44" width="12" height="2" fill="#2a2a2a"/>
    <!-- Blade - upper curved section (silver-white) -->
    <rect x="26" y="20" width="4" height="6" fill="#f0f0f0"/>
    <rect x="30" y="18" width="4" height="8" fill="#f0f0f0"/>
    <rect x="34" y="16" width="2" height="10" fill="#f0f0f0"/>
    <!-- Gold-leaf accent stripe on blade -->
    <rect x="26" y="22" width="4" height="2" fill="#e0a634"/>
    <rect x="30" y="21" width="4" height="2" fill="#e0a634"/>
    <rect x="34" y="20" width="2" height="2" fill="#e0a634"/>
    <!-- Blade - middle section (silver) -->
    <rect x="26" y="26" width="4" height="6" fill="#d0d0d0"/>
    <rect x="30" y="26" width="4" height="6" fill="#d0d0d0"/>
    <rect x="34" y="26" width="2" height="6" fill="#d0d0d0"/>
    <!-- Blade - lower section darker (shadow) -->
    <rect x="26" y="32" width="4" height="10" fill="#a8a8a8"/>
    <rect x="30" y="32" width="4" height="10" fill="#a8a8a8"/>
    <rect x="34" y="32" width="2" height="10" fill="#a8a8a8"/>
    <!-- Blade point/tip -->
    <rect x="32" y="14" width="2" height="4" fill="#e0a634"/>
    <rect x="34" y="14" width="2" height="2" fill="#f0f0f0"/>
    <!-- Frame border (rarity indicator) -->
    <rect x="22" y="14" width="2" height="34" fill="#e0a634"/>
    <rect x="38" y="14" width="2" height="34" fill="#e0a634"/>
    <rect x="22" y="12" width="18" height="2" fill="#e0a634"/>
    <rect x="22" y="48" width="18" height="2" fill="#e0a634"/>
  </g>
</svg>