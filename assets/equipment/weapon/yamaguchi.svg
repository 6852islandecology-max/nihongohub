<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Choshu Long Rifle</title>
  
  <!-- Barrel (dark metal) -->
  <rect x="12" y="20" width="32" height="4" fill="#2a2a2a"/>
  
  <!-- Barrel highlight -->
  <rect x="12" y="20" width="32" height="2" fill="#4a4a4a"/>
  
  <!-- Stock/Grip (wood brown) -->
  <rect x="8" y="24" width="6" height="12" fill="#5c3d2e"/>
  
  <!-- Stock highlight -->
  <rect x="8" y="24" width="6" height="6" fill="#7a5a48"/>
  
  <!-- Trigger guard (gold accent) -->
  <rect x="10" y="30" width="4" height="4" fill="#d4af37"/>
  
  <!-- Ramrod channel -->
  <rect x="12" y="22" width="28" height="1" fill="#1a1a1a"/>
  
  <!-- Muzzle ring (epic rarity purple) -->
  <rect x="44" y="19" width="2" height="6" fill="#a056d2"/>
  
  <!-- Sight post (metal) -->
  <rect x="28" y="18" width="1" height="2" fill="#6a6a6a"/>
  
  <!-- Lock plate (purple accent - rarity) -->
  <rect x="14" y="26" width="4" height="6" fill="#a056d2"/>
  
  <!-- Lock plate detail -->
  <rect x="14" y="26" width="4" height="2" fill="#c280ff"/>
  
  <!-- Bayonet lug -->
  <rect x="44" y="24" width="2" height="4" fill="#8a6a4a"/>
  
  <!-- Butt cap (metal) -->
  <rect x="8" y="36" width="4" height="2" fill="#3a3a3a"/>
  
  <!-- Decorative band -->
  <rect x="20" y="22" width="2" height="2" fill="#a056d2"/>
  <rect x="32" y="22" width="2" height="2" fill="#a056d2"/>
  
  <!-- Forestock wood detail -->
  <rect x="44" y="24" width="4" height="8" fill="#5c3d2e"/>
  <rect x="44" y="24" width="4" height="4" fill="#7a5a48"/>
  
</svg>