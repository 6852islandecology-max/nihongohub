<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Seki Master Katana</title>
  
  <!-- Golden frame border -->
  <g id="frame">
    <rect x="4" y="8" width="56" height="48" fill="none" stroke="#e0a634" stroke-width="2"/>
  </g>
  
  <!-- Blade - silver with gradient effect -->
  <g id="blade">
    <!-- Main blade body -->
    <rect x="20" y="12" width="4" height="28" fill="#e8e8e8"/>
    <rect x="24" y="12" width="4" height="28" fill="#d0d0d0"/>
    
    <!-- Blade edge highlight -->
    <rect x="20" y="12" width="2" height="28" fill="#ffffff"/>
    
    <!-- Blade tip -->
    <rect x="22" y="10" width="4" height="2" fill="#d0d0d0"/>
    <rect x="20" y="8" width="8" height="2" fill="#e8e8e8"/>
  </g>
  
  <!-- Tsuba (hand guard) - golden circular disk -->
  <g id="tsuba">
    <rect x="16" y="38" width="4" height="4" fill="#e0a634"/>
    <rect x="20" y="36" width="4" height="8" fill="#e0a634"/>
    <rect x="24" y="36" width="4" height="8" fill="#e0a634"/>
    <rect x="28" y="38" width="4" height="4" fill="#e0a634"/>
    
    <!-- Center detail -->
    <rect x="22" y="40" width="4" height="2" fill="#c48622"/>
  </g>
  
  <!-- Handle/Grip - dark wood -->
  <g id="handle">
    <rect x="22" y="42" width="4" height="8" fill="#3d2817"/>
    <rect x="22" y="50" width="4" height="4" fill="#2a1810"/>
  </g>
  
  <!-- Menuki (handle ornaments) - gold accents -->
  <g id="menuki">
    <rect x="20" y="44" width="2" height="2" fill="#e0a634"/>
    <rect x="26" y="44" width="2" height="2" fill="#e0a634"/>
    <rect x="20" y="48" width="2" height="2" fill="#e0a634"/>
    <rect x="26" y="48" width="2" height="2" fill="#e0a634"/>
  </g>
  
  <!-- Pommel (kashira) - round dark cap -->
  <g id="pommel">
    <rect x="22" y="54" width="4" height="2" fill="#1a0f0a"/>
    <rect x="20" y="52" width="8" height="2" fill="#2a1810"/>
  </g>
</svg>