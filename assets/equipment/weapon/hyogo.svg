<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Himeji White Heron Spear</title>
  <g id="spear">
    <!-- Spear blade (white) -->
    <rect x="28" y="4" width="8" height="4" fill="#ffffff"/>
    <rect x="24" y="8" width="16" height="4" fill="#ffffff"/>
    <rect x="20" y="12" width="24" height="4" fill="#ffffff"/>
    <rect x="24" y="16" width="16" height="4" fill="#f0f0f0"/>
    
    <!-- Blade edge accent (purple epic frame) -->
    <rect x="20" y="12" width="2" height="4" fill="#a056d2"/>
    <rect x="42" y="12" width="2" height="4" fill="#a056d2"/>
    <rect x="24" y="8" width="2" height="4" fill="#a056d2"/>
    <rect x="38" y="8" width="2" height="4" fill="#a056d2"/>
    <rect x="28" y="4" width="2" height="4" fill="#a056d2"/>
    <rect x="34" y="4" width="2" height="4" fill="#a056d2"/>
    
    <!-- Shaft (light wood tan) -->
    <rect x="28" y="20" width="8" height="20" fill="#d4a574"/>
    <rect x="28" y="40" width="8" height="4" fill="#c99464"/>
    
    <!-- Grip wrapping (purple accent) -->
    <rect x="28" y="36" width="8" height="4" fill="#a056d2"/>
    
    <!-- Heron accent feather motif on blade (white highlight) -->
    <rect x="26" y="10" width="2" height="2" fill="#e8e8e8"/>
    <rect x="36" y="10" width="2" height="2" fill="#e8e8e8"/>
    <rect x="30" y="14" width="2" height="2" fill="#e8e8e8"/>
    <rect x="34" y="14" width="2" height="2" fill="#e8e8e8"/>
    
    <!-- Pommel (purple epic marker) -->
    <rect x="28" y="44" width="8" height="4" fill="#a056d2"/>
    <rect x="30" y="48" width="4" height="2" fill="#8a3fb8"/>
  </g>
</svg>