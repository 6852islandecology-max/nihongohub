<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Suruga Bamboo Lance</title>
  
  <!-- Rare frame border -->
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Bamboo pole shaft - light tan -->
  <g id="shaft">
    <rect x="28" y="12" width="8" height="40" fill="#d4c5a0"/>
    <!-- Bamboo segments -->
    <rect x="28" y="12" width="8" height="1" fill="#a89968"/>
    <rect x="28" y="20" width="8" height="1" fill="#a89968"/>
    <rect x="28" y="28" width="8" height="1" fill="#a89968"/>
    <rect x="28" y="36" width="8" height="1" fill="#a89968"/>
    <rect x="28" y="44" width="8" height="1" fill="#a89968"/>
  </g>
  
  <!-- Grip wrapping - dark brown -->
  <g id="grip">
    <rect x="26" y="44" width="12" height="12" fill="#6b5d48"/>
    <rect x="27" y="45" width="10" height="1" fill="#8b7d68"/>
    <rect x="27" y="49" width="10" height="1" fill="#8b7d68"/>
    <rect x="27" y="53" width="10" height="1" fill="#8b7d68"/>
  </g>
  
  <!-- Bamboo spear blade - light green with metallic accent -->
  <g id="blade">
    <!-- Blade point -->
    <rect x="30" y="4" width="4" height="1" fill="#2d5a3d"/>
    <rect x="28" y="5" width="8" height="1" fill="#3d7a4d"/>
    <rect x="26" y="6" width="12" height="1" fill="#4d9a5d"/>
    <rect x="24" y="7" width="16" height="2" fill="#5daa6d"/>
    <!-- Blade body -->
    <rect x="24" y="9" width="16" height="3" fill="#4d9a5d"/>
    <rect x="26" y="9" width="12" height="1" fill="#6dba7d"/>
    <!-- Crossguard -->
    <rect x="20" y="12" width="24" height="2" fill="#4d8fbf"/>
    <rect x="22" y="12" width="20" height="1" fill="#6dafc0"/>
  </g>
  
  <!-- Metallic edge highlight on blade -->
  <rect x="28" y="6" width="8" height="1" fill="#7fbfd9"/>
  <rect x="26" y="7" width="4" height="1" fill="#7fbfd9"/>
  <rect x="34" y="7" width="4" height="1" fill="#7fbfd9"/>
</svg>