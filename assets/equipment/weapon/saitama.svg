<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Kawagoe Bell Mace</title>
  
  <!-- Handle/Shaft -->
  <rect x="28" y="36" width="8" height="20" fill="#8B6F47"/>
  <rect x="28" y="34" width="8" height="2" fill="#A0826D"/>
  
  <!-- Grip wrap -->
  <rect x="26" y="40" width="12" height="2" fill="#4d8fbf"/>
  <rect x="26" y="46" width="12" height="2" fill="#4d8fbf"/>
  
  <!-- Bell mace head - main bulbous section -->
  <rect x="20" y="14" width="24" height="4" fill="#C4A747"/>
  <rect x="16" y="18" width="32" height="6" fill="#D4B854"/>
  <rect x="16" y="24" width="32" height="4" fill="#C4A747"/>
  <rect x="20" y="28" width="24" height="4" fill="#B8956F"/>
  
  <!-- Bell details - vertical ridges -->
  <rect x="24" y="18" width="2" height="10" fill="#4d8fbf"/>
  <rect x="38" y="18" width="2" height="10" fill="#4d8fbf"/>
  
  <!-- Bell decorative horizontal bands -->
  <rect x="18" y="20" width="28" height="1" fill="#4d8fbf"/>
  <rect x="18" y="26" width="28" height="1" fill="#4d8fbf"/>
  
  <!-- Top cap of bell -->
  <rect x="24" y="10" width="16" height="4" fill="#A0826D"/>
  <rect x="26" y="8" width="12" height="2" fill="#8B6F47"/>
  
  <!-- Rarity frame accent (border highlight) -->
  <rect x="15" y="13" width="1" height="18" fill="#4d8fbf"/>
  <rect x="48" y="13" width="1" height="18" fill="#4d8fbf"/>
  <rect x="15" y="13" width="34" height="1" fill="#4d8fbf"/>
  <rect x="15" y="30" width="34" height="1" fill="#4d8fbf"/>
  
  <!-- Connection point at neck -->
  <rect x="26" y="32" width="12" height="2" fill="#A0826D"/>
</svg>