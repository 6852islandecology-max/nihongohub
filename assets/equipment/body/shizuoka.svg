<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Fuji-view Hanten</title>
  
  <!-- Outer frame/border in rarity color -->
  <rect x="12" y="8" width="40" height="44" fill="none" stroke="#9b9285" stroke-width="2"/>
  
  <!-- Main coat body in deep indigo -->
  <rect x="16" y="12" width="32" height="36" fill="#2c3e50"/>
  
  <!-- Left shoulder -->
  <rect x="12" y="12" width="4" height="8" fill="#2c3e50"/>
  
  <!-- Right shoulder -->
  <rect x="40" y="12" width="4" height="8" fill="#2c3e50"/>
  
  <!-- Left sleeve -->
  <rect x="8" y="16" width="4" height="20" fill="#34495e"/>
  
  <!-- Right sleeve -->
  <rect x="52" y="16" width="4" height="20" fill="#34495e"/>
  
  <!-- Center vertical opening -->
  <rect x="30" y="16" width="4" height="20" fill="#1a1a1a"/>
  
  <!-- Left front panel accent in rust/burgundy -->
  <rect x="16" y="16" width="12" height="24" fill="#8b4513"/>
  
  <!-- Right front panel accent in rust/burgundy -->
  <rect x="36" y="16" width="12" height="24" fill="#8b4513"/>
  
  <!-- Mountain silhouette (Fuji) on chest - white -->
  <!-- Base of mountain -->
  <rect x="20" y="20" width="24" height="4" fill="#f5f5f5"/>
  
  <!-- Left slope of mountain -->
  <rect x="20" y="16" width="4" height="4" fill="#f5f5f5"/>
  <rect x="24" y="12" width="4" height="4" fill="#f5f5f5"/>
  <rect x="28" y="8" width="4" height="4" fill="#f5f5f5"/>
  
  <!-- Right slope of mountain -->
  <rect x="36" y="12" width="4" height="4" fill="#f5f5f5"/>
  <rect x="40" y="16" width="4" height="4" fill="#f5f5f5"/>
  
  <!-- Mountain peak accent in light gray -->
  <rect x="28" y="4" width="4" height="4" fill="#e8e8e8"/>
  
  <!-- Hem decoration pattern -->
  <rect x="18" y="40" width="3" height="4" fill="#9b9285"/>
  <rect x="25" y="40" width="3" height="4" fill="#9b9285"/>
  <rect x="36" y="40" width="3" height="4" fill="#9b9285"/>
  <rect x="43" y="40" width="3" height="4" fill="#9b9285"/>
  
  <!-- Buttons -->
  <rect x="30" y="24" width="2" height="2" fill="#9b9285"/>
  <rect x="32" y="24" width="2" height="2" fill="#9b9285"/>
  <rect x="30" y="32" width="2" height="2" fill="#9b9285"/>
  <rect x="32" y="32" width="2" height="2" fill="#9b9285"/>
</svg>