<!-- Waist tie right -->
<rect x="48" y="16" width="4" height="2" fill="#9b9285"/>
<!-- Bowl pattern detail 1 -->
<rect x="24" y="26" width="2" height="2" fill="#f4a460"/>
<!-- Bowl pattern detail 2 -->
<rect x="38" y="26" width="2" height="2" fill="#f4a460"/>
<!-- Bottom fringe left -->
<rect x="18" y="36" width="2" height="4" fill="#8b3a3a"/>
