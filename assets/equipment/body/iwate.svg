<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
<title>Wanko Soba Apron</title>
<g id="apron">
<!-- Apron neck strap -->
<rect x="28" y="4" width="8" height="4" fill="#9b9285"/>
<!-- Apron main body left -->
<rect x="16" y="12" width="16" height="24" fill="#c41e3a"/>
<!-- Apron main body right -->
<rect x="32" y="12" width="16" height="24" fill="#c41e3a"/>
<!-- Apron border left -->
<rect x="16" y="12" width="2" height="24" fill="#9b9285"/>
<!-- Apron border right -->
<rect x="46" y="12" width="2" height="24" fill="#9b9285"/>
<!-- Apron border bottom -->
<rect x="16" y="34" width="32" height="2" fill="#9b9285"/>
<!-- Apron pocket left -->
<rect x="20" y="18" width="8" height="8" fill="#f4a460"/>
<!-- Apron pocket right -->
<rect x="36" y="18" width="8" height="8" fill="#f4a460"/>
