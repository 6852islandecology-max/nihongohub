<rect x="24" y="36" width="2" height="4" fill="#8b3a3a"/>
<!-- Bottom fringe center-right -->
<rect x="38" y="36" width="2" height="4" fill="#8b3a3a"/>
<!-- Bottom fringe right -->
<rect x="44" y="36" width="2" height="4" fill="#8b3a3a"/>
