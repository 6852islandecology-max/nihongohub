<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Sendai Tanabata Robe</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Robe body - indigo base -->
  <g id="robe">
    <!-- Main torso -->
    <rect x="16" y="16" width="32" height="28" fill="#1a3a5c"/>
    
    <!-- Left sleeve -->
    <rect x="8" y="20" width="8" height="20" fill="#2d5a8c"/>
    
    <!-- Right sleeve -->
    <rect x="48" y="20" width="8" height="20" fill="#2d5a8c"/>
    
    <!-- Collar/neckline -->
    <rect x="24" y="14" width="16" height="4" fill="#9b9285"/>
    <rect x="20" y="18" width="24" height="2" fill="#9b9285"/>
  </g>
  
  <!-- Star festival decoration patterns -->
  <g id="stars" fill="#ffd700">
    <!-- Top left stars -->
    <rect x="20" y="22" width="4" height="4" fill="#ffd700"/>
    <rect x="28" y="20" width="4" height="4" fill="#ffd700"/>
    
    <!-- Top right stars -->
    <rect x="36" y="22" width="4" height="4" fill="#ffd700"/>
    <rect x="44" y="20" width="4" height="4" fill="#ffd700"/>
    
    <!-- Center accent -->
    <rect x="28" y="30" width="4" height="4" fill="#ffd700"/>
  </g>
  
  <!-- Decorative stripes (tanabata weaving pattern) -->
  <g id="stripes" fill="#e8d4b8" opacity="0.7">
    <rect x="18" y="26" width="2" height="12" fill="#e8d4b8"/>
    <rect x="28" y="26" width="2" height="12" fill="#e8d4b8"/>
    <rect x="38" y="26" width="2" height="12" fill="#e8d4b8"/>
  </g>
  
  <!-- Hem detail -->
  <rect x="16" y="42" width="32" height="2" fill="#9b9285"/>
  
</svg>