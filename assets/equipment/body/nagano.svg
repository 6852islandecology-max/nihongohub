<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Soba-fields Coat</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Coat body - tan/beige base -->
  <g id="coat">
    <!-- Left sleeve -->
    <rect x="8" y="20" width="8" height="24" fill="#c9a876"/>
    <!-- Right sleeve -->
    <rect x="48" y="20" width="8" height="24" fill="#c9a876"/>
    <!-- Main torso -->
    <rect x="16" y="16" width="32" height="28" fill="#d4b896"/>
    <!-- Center panel darker -->
    <rect x="20" y="16" width="24" height="28" fill="#c9a876"/>
  </g>
  
  <!-- Buckwheat pattern detail - darker brown strokes -->
  <g id="pattern">
    <!-- Left side buckwheat accent lines -->
    <rect x="16" y="24" width="4" height="2" fill="#8b7355"/>
    <rect x="16" y="32" width="4" height="2" fill="#8b7355"/>
    <!-- Right side buckwheat accent lines -->
    <rect x="44" y="24" width="4" height="2" fill="#8b7355"/>
    <rect x="44" y="32" width="4" height="2" fill="#8b7355"/>
    <!-- Center vertical trim -->
    <rect x="30" y="16" width="4" height="28" fill="#8b7355"/>
  </g>
  
  <!-- Collar detail -->
  <g id="collar">
    <rect x="24" y="16" width="16" height="4" fill="#9b9285"/>
  </g>
  
  <!-- Sleeve cuffs -->
  <g id="cuffs">
    <rect x="8" y="40" width="8" height="4" fill="#9b9285"/>
    <rect x="48" y="40" width="8" height="4" fill="#9b9285"/>
  </g>
  
</svg>