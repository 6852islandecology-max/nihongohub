<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<title>Kasama Pottery Apron</title>
<g id="apron">
<!-- Apron frame border -->
<rect x="12" y="8" width="40" height="48" fill="none" stroke="#9b9285" stroke-width="1"/>
<!-- Apron main body - earthen brown -->
<rect x="16" y="12" width="32" height="40" fill="#a89080"/>
<!-- Apron left strap -->
<rect x="12" y="8" width="4" height="8" fill="#9b9285"/>
<!-- Apron right strap -->
<rect x="48" y="8" width="4" height="8" fill="#9b9285"/>
<!-- Apron waist tie left -->
<rect x="8" y="16" width="8" height="4" fill="#8b7d6b"/>
<!-- Apron waist tie right -->
<rect x="48" y="16" width="8" height="4" fill="#8b7d6b"/>
<!-- Clay texture - left side -->
<rect x="20" y="16" width="4" height="4" fill="#9b8f7d"/>
<rect x="24" y="24" width="4" height="4" fill="#9b8f7d"/>
<!-- Clay texture - center -->
<rect x="28" y="20" width="4" height="4" fill="#9b8f7d"/>
<!-- Clay texture - right side -->
<rect x="40" y="16" width="4" height="4" fill="#9b8f7d"/>
<rect x="36" y="24" width="4" height="4" fill="#9b8f7d"/>
<!-- Apron bottom hem shadow -->
<rect x="16" y="48" width="32" height="4" fill="#8b7d6b"/>
<!-- Pocket detail left -->
<rect x="20" y="32" width="8" height="8" fill="#9b8f7d" opacity="0.7"/>
<!-- Pocket detail right -->
<rect x="36" y="32" width="8" height="8" fill="#9b8f7d" opacity="0.7"/>
</g>
</svg>