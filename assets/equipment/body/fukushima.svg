<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Ouchi-juku Cloak</title>
  
  <!-- Rarity frame border -->
  <rect x="4" y="8" width="56" height="48" fill="none" stroke="#9b9285" stroke-width="2"/>
  
  <!-- Main cloak body - dark brown -->
  <g id="cloak">
    <!-- Left shoulder -->
    <rect x="12" y="16" width="8" height="4" fill="#5c4a3d"/>
    <rect x="8" y="20" width="12" height="4" fill="#5c4a3d"/>
    <rect x="8" y="24" width="12" height="4" fill="#5c4a3d"/>
    <rect x="8" y="28" width="12" height="4" fill="#5c4a3d"/>
    
    <!-- Right shoulder -->
    <rect x="44" y="16" width="8" height="4" fill="#5c4a3d"/>
    <rect x="44" y="20" width="12" height="4" fill="#5c4a3d"/>
    <rect x="44" y="24" width="12" height="4" fill="#5c4a3d"/>
    <rect x="44" y="28" width="12" height="4" fill="#5c4a3d"/>
    
    <!-- Center front panel -->
    <rect x="20" y="16" width="24" height="4" fill="#6b5847"/>
    <rect x="20" y="20" width="24" height="4" fill="#6b5847"/>
    <rect x="20" y="24" width="24" height="4" fill="#6b5847"/>
    <rect x="20" y="28" width="24" height="4" fill="#6b5847"/>
    
    <!-- Lower panels left -->
    <rect x="8" y="32" width="12" height="4" fill="#5c4a3d"/>
    <rect x="8" y="36" width="12" height="4" fill="#5c4a3d"/>
    <rect x="12" y="40" width="8" height="4" fill="#5c4a3d"/>
    
    <!-- Lower panels right -->
    <rect x="44" y="32" width="12" height="4" fill="#5c4a3d"/>
    <rect x="44" y="36" width="12" height="4" fill="#5c4a3d"/>
    <rect x="44" y="40" width="8" height="4" fill="#5c4a3d"/>
    
    <!-- Center lower -->
    <rect x="20" y="32" width="24" height="4" fill="#6b5847"/>
    <rect x="20" y="36" width="24" height="4" fill="#6b5847"/>
    <rect x="20" y="40" width="24" height="4" fill="#6b5847"/>
  </g>
  
  <!-- Decorative pattern - tan accent stripes -->
  <g id="pattern">
    <rect x="16" y="20" width="4" height="16" fill="#9b9285" opacity="0.6"/>
    <rect x="44" y="20" width="4" height="16" fill="#9b9285" opacity="0.6"/>
  </g>
  
  <!-- Top collar accent -->
  <rect x="24" y="12" width="16" height="4" fill="#8b7968"/>
  
  <!-- Texture detail - vertical lines -->
  <rect x="28" y="24" width="2" height="20" fill="#4a3930" opacity="0.4"/>
  <rect x="34" y="24" width="2" height="20" fill="#4a3930" opacity="0.4"/>
</svg>