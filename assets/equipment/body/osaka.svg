<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Osaka Castle Hanten</title>
  
  <!-- Outer robe border (epic purple) -->
  <rect x="12" y="12" width="40" height="36" fill="#a056d2"/>
  
  <!-- Main robe body (dark red/burgundy) -->
  <rect x="16" y="16" width="32" height="28" fill="#8b3a3a"/>
  
  <!-- Left shoulder panel -->
  <rect x="12" y="16" width="8" height="12" fill="#c44536"/>
  
  <!-- Right shoulder panel -->
  <rect x="44" y="16" width="8" height="12" fill="#c44536"/>
  
  <!-- Gold trim horizontal band -->
  <rect x="16" y="20" width="32" height="4" fill="#d4af37"/>
  
  <!-- Center chest detail (gold accent) -->
  <rect x="28" y="24" width="8" height="8" fill="#ffd700"/>
  
  <!-- Left chest accent -->
  <rect x="20" y="24" width="4" height="8" fill="#d4af37"/>
  
  <!-- Right chest accent -->
  <rect x="40" y="24" width="4" height="8" fill="#d4af37"/>
  
  <!-- Lower robe segment left -->
  <rect x="16" y="32" width="12" height="12" fill="#6b2828"/>
  
  <!-- Lower robe segment center -->
  <rect x="28" y="32" width="8" height="12" fill="#8b3a3a"/>
  
  <!-- Lower robe segment right -->
  <rect x="36" y="32" width="12" height="12" fill="#6b2828"/>
  
  <!-- Gold hem trim bottom -->
  <rect x="16" y="40" width="32" height="2" fill="#d4af37"/>
  
  <!-- Purple accent borders (sleeves) -->
  <rect x="12" y="24" width="2" height="8" fill="#a056d2"/>
  <rect x="50" y="24" width="2" height="8" fill="#a056d2"/>
</svg>