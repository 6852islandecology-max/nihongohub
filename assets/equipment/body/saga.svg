<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Karatsu Cloth Robe</title>
  <g id="robe">
    <!-- Frame border -->
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="4"/>
    
    <!-- Main robe body - light beige/tan weave -->
    <rect x="12" y="12" width="40" height="36" fill="#d4c5b0"/>
    
    <!-- Left sleeve -->
    <rect x="8" y="16" width="8" height="20" fill="#c9b8a3"/>
    
    <!-- Right sleeve -->
    <rect x="48" y="16" width="8" height="20" fill="#c9b8a3"/>
    
    <!-- Center front closure/seam -->
    <rect x="30" y="12" width="4" height="36" fill="#9b9285"/>
    
    <!-- Karatsu weave pattern - horizontal stripes -->
    <rect x="12" y="16" width="18" height="4" fill="#a59681"/>
    <rect x="34" y="16" width="18" height="4" fill="#a59681"/>
    
    <rect x="12" y="24" width="18" height="4" fill="#a59681"/>
    <rect x="34" y="24" width="18" height="4" fill="#a59681"/>
    
    <rect x="12" y="32" width="18" height="4" fill="#a59681"/>
    <rect x="34" y="32" width="18" height="4" fill="#a59681"/>
    
    <!-- Sleeve details -->
    <rect x="8" y="20" width="8" height="2" fill="#a59681"/>
    <rect x="8" y="28" width="8" height="2" fill="#a59681"/>
    
    <rect x="48" y="20" width="8" height="2" fill="#a59681"/>
    <rect x="48" y="28" width="8" height="2" fill="#a59681"/>
    
    <!-- Collar/neckline -->
    <rect x="26" y="12" width="4" height="4" fill="#9b9285"/>
    <rect x="34" y="12" width="4" height="4" fill="#9b9285"/>
  </g>
</svg>