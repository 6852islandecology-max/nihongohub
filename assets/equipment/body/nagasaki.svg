<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Glover Garden Coat</title>
  <g id="coat">
    <!-- Frame border -->
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="4"/>
    
    <!-- Main coat body - dark navy blue -->
    <rect x="12" y="16" width="40" height="36" fill="#1a3a52"/>
    
    <!-- Left lapel -->
    <rect x="12" y="16" width="12" height="20" fill="#2d5a7a"/>
    
    <!-- Right lapel -->
    <rect x="40" y="16" width="12" height="20" fill="#2d5a7a"/>
    
    <!-- Coat collar - lighter blue accent -->
    <rect x="16" y="12" width="32" height="8" fill="#4d8fbf"/>
    
    <!-- Left button column -->
    <rect x="18" y="20" width="4" height="4" fill="#c9a961"/>
    <rect x="18" y="28" width="4" height="4" fill="#c9a961"/>
    <rect x="18" y="36" width="4" height="4" fill="#c9a961"/>
    
    <!-- Right button column -->
    <rect x="44" y="20" width="4" height="4" fill="#c9a961"/>
    <rect x="44" y="28" width="4" height="4" fill="#c9a961"/>
    <rect x="44" y="36" width="4" height="4" fill="#c9a961"/>
    
    <!-- Waist cinch detail -->
    <rect x="14" y="32" width="36" height="4" fill="#4d8fbf"/>
    
    <!-- Left pocket -->
    <rect x="16" y="40" width="8" height="8" fill="#2d5a7a"/>
    
    <!-- Right pocket -->
    <rect x="40" y="40" width="8" height="8" fill="#2d5a7a"/>
    
    <!-- Coat tails bottom left -->
    <rect x="12" y="48" width="12" height="8" fill="#1a3a52"/>
    
    <!-- Coat tails bottom right -->
    <rect x="40" y="48" width="12" height="8" fill="#1a3a52"/>
  </g>
</svg>