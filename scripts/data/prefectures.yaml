# - 緯度経度はおおよその県庁所在地中心、Google Maps Embed の placeholder として使用
# - flagship_spots: 各都道府県の主要 3 spot（PR-11 prompt が必要）
#   → spot 内容は文献ベースで秘書が初版選定、オーナー後で訂正可

