<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Tea Ceremony Chasen</title>
  
  <!-- Handle/Grip -->
  <g id="handle">
    <rect x="28" y="44" width="8" height="16" fill="#8b6f47"/>
    <rect x="24" y="48" width="16" height="4" fill="#a56a2d"/>
  </g>
  
  <!-- Whisk Bowl Frame (Epic Purple Border) -->
  <g id="whisk-frame">
    <rect x="20" y="12" width="24" height="4" fill="#a056d2"/>
    <rect x="16" y="16" width="32" height="4" fill="#a056d2"/>
    <rect x="16" y="40" width="32" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Whisk Bristles - Upper -->
  <g id="bristles-upper">
    <rect x="18" y="20" width="4" height="8" fill="#d4a574"/>
    <rect x="22" y="18" width="4" height="12" fill="#e8c9a0"/>
    <rect x="26" y="16" width="4" height="14" fill="#d4a574"/>
    <rect x="30" y="16" width="4" height="14" fill="#d4a574"/>
    <rect x="34" y="18" width="4" height="12" fill="#e8c9a0"/>
    <rect x="38" y="20" width="4" height="8" fill="#d4a574"/>
  </g>
  
  <!-- Whisk Bristles - Lower -->
  <g id="bristles-lower">
    <rect x="18" y="32" width="4" height="8" fill="#d4a574"/>
    <rect x="22" y="30" width="4" height="10" fill="#e8c9a0"/>
    <rect x="26" y="28" width="4" height="12" fill="#d4a574"/>
    <rect x="30" y="28" width="4" height="12" fill="#d4a574"/>
    <rect x="34" y="30" width="4" height="10" fill="#e8c9a0"/>
    <rect x="38" y="32" width="4" height="8" fill="#d4a574"/>
  </g>
  
  <!-- Center Detail Rings -->
  <g id="detail-rings">
    <rect x="26" y="28" width="12" height="2" fill="#a056d2"/>
    <rect x="26" y="34" width="12" height="2" fill="#a056d2"/>
  </g>
</svg>