<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Tateyama Halberd</title>
  
  <!-- Handle/shaft -->
  <rect x="28" y="32" width="8" height="24" fill="#8B4513"/>
  <rect x="28" y="28" width="8" height="4" fill="#A0522D"/>
  
  <!-- Grip wrapping -->
  <rect x="26" y="40" width="12" height="2" fill="#D4AF37"/>
  <rect x="26" y="48" width="12" height="2" fill="#D4AF37"/>
  
  <!-- Main blade (curved naginata-style) -->
  <rect x="20" y="8" width="24" height="4" fill="#4d8fbf"/>
  <rect x="18" y="12" width="28" height="4" fill="#4d8fbf"/>
  <rect x="16" y="16" width="32" height="4" fill="#4d8fbf"/>
  <rect x="18" y="20" width="28" height="4" fill="#4d8fbf"/>
  <rect x="20" y="24" width="24" height="4" fill="#4d8fbf"/>
  
  <!-- Blade highlight/edge -->
  <rect x="22" y="10" width="20" height="2" fill="#6BA3D4"/>
  <rect x="20" y="14" width="24" height="2" fill="#6BA3D4"/>
  <rect x="18" y="18" width="28" height="2" fill="#6BA3D4"/>
  
  <!-- Cross-guard -->
  <rect x="20" y="28" width="24" height="4" fill="#2C3E50"/>
  <rect x="16" y="29" width="32" height="2" fill="#4d8fbf"/>
  
  <!-- Pommel cap -->
  <rect x="26" y="56" width="12" height="4" fill="#2C3E50"/>
  <rect x="24" y="60" width="16" height="2" fill="#4d8fbf"/>
</svg>