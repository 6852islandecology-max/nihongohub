<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Mito Plum Naginata</title>
  
  <!-- Frame border -->
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Shaft/Handle - dark brown -->
  <rect x="28" y="16" width="8" height="40" fill="#3d2817"/>
  
  <!-- Handle grip - wrapped cord detail -->
  <rect x="28" y="40" width="8" height="4" fill="#5a3d28"/>
  <rect x="28" y="44" width="8" height="4" fill="#3d2817"/>
  
  <!-- Blade base connector -->
  <rect x="24" y="12" width="16" height="4" fill="#4d8fbf"/>
  
  <!-- Main curved blade silhouette - split into sections for naginata curve -->
  <!-- Upper blade section -->
  <rect x="20" y="4" width="4" height="8" fill="#b8956a"/>
  <rect x="24" y="2" width="16" height="4" fill="#d4a574"/>
  <rect x="40" y="4" width="4" height="8" fill="#b8956a"/>
  
  <!-- Blade middle -->
  <rect x="20" y="12" width="4" height="4" fill="#b8956a"/>
  <rect x="40" y="12" width="4" height="4" fill="#b8956a"/>
  
  <!-- Plum blossom detail - center of blade -->
  <rect x="28" y="6" width="8" height="2" fill="#e8d5c4"/>
  <rect x="26" y="8" width="12" height="2" fill="#f5ede5"/>
  <rect x="28" y="10" width="8" height="2" fill="#e8d5c4"/>
  
  <!-- Blade edge highlights -->
  <rect x="18" y="8" width="2" height="8" fill="#9d7d5d"/>
  <rect x="44" y="8" width="2" height="8" fill="#9d7d5d"/>
  
  <!-- Pommel at base -->
  <rect x="26" y="54" width="12" height="4" fill="#4d8fbf"/>
  <rect x="28" y="58" width="8" height="2" fill="#3d6b99"/>
</svg>