<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Izumo Shrine Sword</title>
  
  <!-- Golden frame border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#e0a634" stroke-width="2"/>
  
  <!-- Blade - dark steel -->
  <rect x="24" y="8" width="4" height="32" fill="#2a2a3e"/>
  <rect x="20" y="10" width="12" height="2" fill="#2a2a3e"/>
  <rect x="20" y="28" width="12" height="2" fill="#2a2a3e"/>
  
  <!-- Blade edge highlight - silver -->
  <rect x="26" y="8" width="2" height="32" fill="#e8e8e8"/>
  
  <!-- Blade shine accent -->
  <rect x="24" y="12" width="4" height="4" fill="#a8a8c0"/>
  <rect x="24" y="20" width="4" height="3" fill="#a8a8c0"/>
  
  <!-- Tsuba (guard) - golden -->
  <rect x="16" y="38" width="20" height="4" fill="#e0a634"/>
  <rect x="18" y="37" width="16" height="1" fill="#d4941f"/>
  <rect x="18" y="42" width="16" height="1" fill="#d4941f"/>
  
  <!-- Handle/Grip - dark wood -->
  <rect x="22" y="42" width="8" height="14" fill="#5a3a2a"/>
  
  <!-- Grip wrapping - lighter accent -->
  <rect x="22" y="44" width="8" height="2" fill="#8a6a5a"/>
  <rect x="22" y="48" width="8" height="2" fill="#8a6a5a"/>
  <rect x="22" y="52" width="8" height="2" fill="#8a6a5a"/>
  
  <!-- Pommel - golden sphere -->
  <rect x="24" y="56" width="4" height="4" fill="#e0a634"/>
  <rect x="25" y="57" width="2" height="2" fill="#f0c860"/>
  
  <!-- Sacred shrine emblem on blade -->
  <rect x="26" y="16" width="2" height="1" fill="#e0a634"/>
  <rect x="25" y="17" width="4" height="1" fill="#e0a634"/>
  <rect x="26" y="18" width="2" height="1" fill="#e0a634"/>
</svg>