<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Nanbu Iron Mace</title>
  
  <!-- Rare rarity frame -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Handle/Grip (wood-brown) -->
  <rect x="28" y="36" width="8" height="20" fill="#8B6F47"/>
  <rect x="26" y="40" width="12" height="2" fill="#6B5437"/>
  <rect x="26" y="46" width="12" height="2" fill="#6B5437"/>
  <rect x="26" y="52" width="12" height="2" fill="#6B5437"/>
  
  <!-- Hammer Head (dark iron) -->
  <!-- Top striking surface -->
  <rect x="20" y="12" width="24" height="12" fill="#2C3E50"/>
  <!-- Left side face -->
  <rect x="16" y="16" width="4" height="12" fill="#1A252F"/>
  <!-- Right side face -->
  <rect x="44" y="16" width="4" height="12" fill="#1A252F"/>
  <!-- Bottom detail -->
  <rect x="20" y="24" width="24" height="4" fill="#445566"/>
  
  <!-- Highlights on hammer head (accent with rare blue) -->
  <rect x="22" y="14" width="20" height="2" fill="#4d8fbf"/>
  <rect x="22" y="20" width="4" height="2" fill="#5A9FD4"/>
  <rect x="40" y="20" width="4" height="2" fill="#5A9FD4"/>
  
  <!-- Connection between handle and head -->
  <rect x="28" y="28" width="8" height="8" fill="#3D5A6C"/>
  <rect x="30" y="30" width="4" height="4" fill="#4d8fbf"/>
</svg>