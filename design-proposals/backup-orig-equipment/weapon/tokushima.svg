<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Awa Odori Sandalwood Fan</title>
  
  <!-- Handle/Grip -->
  <rect x="28" y="48" width="8" height="16" fill="#8b6f47"/>
  <rect x="28" y="48" width="8" height="4" fill="#a0825a"/>
  
  <!-- Fan Base -->
  <rect x="20" y="44" width="24" height="4" fill="#4d8fbf"/>
  
  <!-- Main Fan Blade - Left Side -->
  <rect x="12" y="36" width="4" height="8" fill="#d4a574"/>
  <rect x="16" y="28" width="4" height="8" fill="#d4a574"/>
  <rect x="20" y="20" width="4" height="8" fill="#d4a574"/>
  <rect x="24" y="12" width="4" height="8" fill="#d4a574"/>
  
  <!-- Main Fan Blade - Center -->
  <rect x="28" y="8" width="8" height="4" fill="#e8c4a0"/>
  
  <!-- Main Fan Blade - Right Side -->
  <rect x="36" y="12" width="4" height="8" fill="#d4a574"/>
  <rect x="40" y="20" width="4" height="8" fill="#d4a574"/>
  <rect x="44" y="28" width="4" height="8" fill="#d4a574"/>
  <rect x="48" y="36" width="4" height="8" fill="#d4a574"/>
  
  <!-- Fan Decoration - Blue Accent Stripes -->
  <rect x="16" y="32" width="4" height="4" fill="#4d8fbf"/>
  <rect x="28" y="20" width="8" height="4" fill="#4d8fbf"/>
  <rect x="44" y="32" width="4" height="4" fill="#4d8fbf"/>
  
  <!-- Fan Pattern - Center Detail -->
  <rect x="24" y="16" width="4" height="4" fill="#2d5a7f"/>
  <rect x="36" y="16" width="4" height="4" fill="#2d5a7f"/>
  
  <!-- Border Frame -->
  <rect x="11" y="7" width="42" height="42" fill="none" stroke="#4d8fbf" stroke-width="2"/>
</svg>