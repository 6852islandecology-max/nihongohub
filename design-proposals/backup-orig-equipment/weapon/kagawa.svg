<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Sanuki Udon Rolling Pin</title>
  
  <!-- Grip/Handle -->
  <rect x="4" y="20" width="8" height="24" fill="#8b7355"/>
  <rect x="4" y="20" width="8" height="2" fill="#9b9285"/>
  <rect x="4" y="42" width="8" height="2" fill="#9b9285"/>
  
  <!-- Handle accent rings -->
  <rect x="4" y="26" width="8" height="1" fill="#9b9285"/>
  <rect x="4" y="32" width="8" height="1" fill="#9b9285"/>
  <rect x="4" y="38" width="8" height="1" fill="#9b9285"/>
  
  <!-- Main rolling pin barrel - left section -->
  <rect x="12" y="18" width="20" height="28" fill="#f4e4c1"/>
  <rect x="12" y="18" width="20" height="2" fill="#9b9285"/>
  <rect x="12" y="44" width="20" height="2" fill="#9b9285"/>
  
  <!-- Rolling pin surface texture lines -->
  <rect x="12" y="22" width="20" height="1" fill="#dcc9a8"/>
  <rect x="12" y="26" width="20" height="1" fill="#dcc9a8"/>
  <rect x="12" y="30" width="20" height="1" fill="#dcc9a8"/>
  <rect x="12" y="34" width="20" height="1" fill="#dcc9a8"/>
  <rect x="12" y="38" width="20" height="1" fill="#dcc9a8"/>
  <rect x="12" y="42" width="20" height="1" fill="#dcc9a8"/>
  
  <!-- Right barrel extension -->
  <rect x="32" y="20" width="16" height="24" fill="#f4e4c1"/>
  <rect x="32" y="20" width="16" height="2" fill="#9b9285"/>
  <rect x="32" y="42" width="16" height="2" fill="#9b9285"/>
  
  <!-- Right barrel texture -->
  <rect x="32" y="24" width="16" height="1" fill="#dcc9a8"/>
  <rect x="32" y="28" width="16" height="1" fill="#dcc9a8"/>
  <rect x="32" y="32" width="16" height="1" fill="#dcc9a8"/>
  <rect x="32" y="36" width="16" height="1" fill="#dcc9a8"/>
  <rect x="32" y="40" width="16" height="1" fill="#dcc9a8"/>
  
  <!-- Right end cap -->
  <rect x="48" y="22" width="4" height="20" fill="#9b9285"/>
  <rect x="48" y="22" width="4" height="2" fill="#c4b5a0"/>
  
</svg>