<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Kumano Pilgrim Staff</title>
  <g id="staff">
    <!-- Staff shaft - dark wood -->
    <rect x="28" y="4" width="8" height="48" fill="#3d2817"/>
    <!-- Shaft highlight -->
    <rect x="30" y="4" width="2" height="48" fill="#5c4033"/>
    
    <!-- Upper ornamental ring -->
    <rect x="26" y="6" width="12" height="2" fill="#a056d2"/>
    <rect x="24" y="8" width="16" height="1" fill="#a056d2"/>
    
    <!-- Staff head - wooden knob -->
    <rect x="24" y="2" width="16" height="4" fill="#8b5a2b"/>
    <rect x="26" y="1" width="12" height="1" fill="#a0826d"/>
    
    <!-- Metal ferrule top -->
    <rect x="26" y="10" width="12" height="2" fill="#8b7355"/>
    
    <!-- Middle decorative band -->
    <rect x="26" y="26" width="12" height="2" fill="#a056d2"/>
    <rect x="24" y="25" width="16" height="1" fill="#a056d2"/>
    <rect x="24" y="28" width="16" height="1" fill="#a056d2"/>
    
    <!-- Lower ferrule -->
    <rect x="26" y="48" width="12" height="2" fill="#8b7355"/>
    
    <!-- Staff tip - iron point -->
    <rect x="28" y="52" width="8" height="2" fill="#4a4a4a"/>
    <rect x="28" y="54" width="8" height="2" fill="#3d3d3d"/>
    <rect x="30" y="56" width="4" height="2" fill="#2a2a2a"/>
    
    <!-- Sacred knot decoration on shaft -->
    <rect x="24" y="20" width="4" height="2" fill="#a056d2"/>
    <rect x="36" y="20" width="4" height="2" fill="#a056d2"/>
    <rect x="26" y="18" width="2" height="6" fill="#a056d2"/>
    <rect x="36" y="18" width="2" height="6" fill="#a056d2"/>
    
    <!-- Border/frame accent -->
    <rect x="22" y="0" width="1" height="60" fill="#a056d2"/>
    <rect x="41" y="0" width="1" height="60" fill="#a056d2"/>
  </g>
</svg>