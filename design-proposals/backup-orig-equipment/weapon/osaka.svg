<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Takoyaki Pan Mace</title>
  
  <!-- Handle/Grip (dark brown) -->
  <g id="handle">
    <rect x="28" y="36" width="8" height="20" fill="#3d2817"/>
    <rect x="24" y="40" width="4" height="4" fill="#5a3a24"/>
    <rect x="36" y="40" width="4" height="4" fill="#5a3a24"/>
  </g>
  
  <!-- Shaft connector (iron gray) -->
  <g id="connector">
    <rect x="26" y="32" width="12" height="4" fill="#4a4a4a"/>
  </g>
  
  <!-- Grid plate base (dark iron) -->
  <g id="gridplate">
    <rect x="20" y="20" width="24" height="12" fill="#2a2a2a"/>
  </g>
  
  <!-- Takoyaki grid pattern (metal grid accent) -->
  <g id="grid-pattern" fill="#4d8fbf">
    <rect x="24" y="24" width="4" height="4" fill="none" stroke="#4d8fbf" stroke-width="1"/>
    <rect x="32" y="24" width="4" height="4" fill="none" stroke="#4d8fbf" stroke-width="1"/>
    <rect x="24" y="28" width="4" height="4" fill="none" stroke="#4d8fbf" stroke-width="1"/>
    <rect x="32" y="28" width="4" height="4" fill="none" stroke="#4d8fbf" stroke-width="1"/>
  </g>
  
  <!-- Takoyaki indentations (circular bumps) -->
  <g id="takoyaki-bumps" fill="#5a5a5a">
    <rect x="26" y="22" width="4" height="3" fill="#5a5a5a"/>
    <rect x="34" y="22" width="4" height="3" fill="#5a5a5a"/>
    <rect x="26" y="30" width="4" height="3" fill="#5a5a5a"/>
    <rect x="34" y="30" width="4" height="3" fill="#5a5a5a"/>
  </g>
  
  <!-- Rarity frame border (#4d8fbf) -->
  <g id="frame" fill="none" stroke="#4d8fbf" stroke-width="2">
    <rect x="18" y="18" width="28" height="28"/>
  </g>
  
  <!-- Highlight edge (lighter accent) -->
  <g id="shine" fill="#7db3d9">
    <rect x="20" y="20" width="2" height="8" fill="#7db3d9" opacity="0.6"/>
  </g>
</svg>