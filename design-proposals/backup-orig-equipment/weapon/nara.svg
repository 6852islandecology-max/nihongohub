<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Deer Antler Staff</title>
  
  <!-- Staff Handle (brown wood) -->
  <g id="handle">
    <rect x="28" y="32" width="8" height="24" fill="#8B6F47"/>
    <rect x="28" y="32" width="8" height="2" fill="#A0826D"/>
  </g>
  
  <!-- Left Antler (epic purple accent) -->
  <g id="left-antler">
    <rect x="20" y="24" width="4" height="4" fill="#a056d2"/>
    <rect x="16" y="20" width="4" height="4" fill="#a056d2"/>
    <rect x="12" y="16" width="4" height="4" fill="#a056d2"/>
    <rect x="16" y="12" width="4" height="4" fill="#8B4FA8"/>
    <rect x="20" y="20" width="4" height="4" fill="#8B4FA8"/>
    <rect x="24" y="16" width="4" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Right Antler (epic purple accent) -->
  <g id="right-antler">
    <rect x="40" y="24" width="4" height="4" fill="#a056d2"/>
    <rect x="44" y="20" width="4" height="4" fill="#a056d2"/>
    <rect x="48" y="16" width="4" height="4" fill="#a056d2"/>
    <rect x="44" y="12" width="4" height="4" fill="#8B4FA8"/>
    <rect x="40" y="20" width="4" height="4" fill="#8B4FA8"/>
    <rect x="36" y="16" width="4" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Antler Base Connection -->
  <g id="base">
    <rect x="24" y="28" width="16" height="4" fill="#D4AF8F"/>
    <rect x="24" y="28" width="4" height="4" fill="#a056d2"/>
    <rect x="36" y="28" width="4" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Grip wrapping -->
  <g id="grip">
    <rect x="28" y="48" width="8" height="2" fill="#6B5839"/>
    <rect x="28" y="52" width="8" height="2" fill="#6B5839"/>
  </g>
  
  <!-- Ferrule (metal base) -->
  <g id="ferrule">
    <rect x="26" y="54" width="12" height="2" fill="#a056d2"/>
    <rect x="26" y="56" width="12" height="2" fill="#8B4FA8"/>
  </g>
</svg>