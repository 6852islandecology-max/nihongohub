<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Edo Town Fireman's Hook</title>
  
  <!-- Handle/Shaft -->
  <g id="handle">
    <rect x="28" y="36" width="8" height="20" fill="#8B4513"/>
    <rect x="28" y="36" width="8" height="2" fill="#a056d2"/>
  </g>
  
  <!-- Grip wrapping -->
  <g id="grip">
    <rect x="28" y="44" width="8" height="2" fill="#a056d2"/>
    <rect x="28" y="50" width="8" height="2" fill="#a056d2"/>
  </g>
  
  <!-- Main hook curve (upper left arc) -->
  <g id="hook">
    <!-- Hook shaft extension -->
    <rect x="20" y="28" width="8" height="8" fill="#8B4513"/>
    
    <!-- Hook point (the curved catching part) -->
    <rect x="12" y="20" width="8" height="8" fill="#C0C0C0"/>
    <rect x="12" y="12" width="4" height="8" fill="#C0C0C0"/>
    <rect x="8" y="12" width="4" height="4" fill="#808080"/>
    
    <!-- Hook tip accent -->
    <rect x="8" y="12" width="4" height="2" fill="#a056d2"/>
  </g>
  
  <!-- Banner/flag attachment -->
  <g id="banner">
    <!-- Banner pole connector -->
    <rect x="24" y="24" width="4" height="8" fill="#8B4513"/>
    
    <!-- Banner fabric - red/gold Edo style -->
    <rect x="16" y="12" width="12" height="12" fill="#DC143C"/>
    <rect x="16" y="12" width="12" height="2" fill="#FFD700"/>
    
    <!-- Banner accent circle (Edo fire mark) -->
    <rect x="20" y="16" width="4" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Border/Frame accent -->
  <g id="border">
    <rect x="8" y="8" width="48" height="48" fill="none" stroke="#a056d2" stroke-width="1"/>
  </g>
</svg>