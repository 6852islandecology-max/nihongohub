<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Nikko Toshogu Tachi</title>
  
  <!-- Rarity frame border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="2"/>
  
  <!-- Blade - upper curved section (dark steel) -->
  <rect x="28" y="8" width="8" height="4" fill="#2a2a3a"/>
  <rect x="26" y="12" width="12" height="4" fill="#2a2a3a"/>
  <rect x="24" y="16" width="16" height="4" fill="#2a2a3a"/>
  <rect x="22" y="20" width="20" height="4" fill="#2a2a3a"/>
  
  <!-- Blade - middle section (lighter steel with shine) -->
  <rect x="24" y="24" width="16" height="4" fill="#4a4a5a"/>
  <rect x="26" y="28" width="12" height="4" fill="#4a4a5a"/>
  <rect x="28" y="32" width="8" height="4" fill="#4a4a5a"/>
  
  <!-- Blade highlight (sacred glow) -->
  <rect x="30" y="16" width="4" height="4" fill="#d4af7a"/>
  <rect x="30" y="20" width="4" height="4" fill="#d4af7a"/>
  
  <!-- Tang (stem connecting blade to handle) -->
  <rect x="28" y="36" width="8" height="4" fill="#3a3a4a"/>
  
  <!-- Handle/Grip section -->
  <rect x="26" y="40" width="12" height="4" fill="#8b4513"/>
  <rect x="26" y="44" width="12" height="4" fill="#6b3410"/>
  
  <!-- Sacred shrine accent (gold band on grip) -->
  <rect x="26" y="48" width="12" height="4" fill="#a056d2"/>
  
  <!-- Pommel (handle end) -->
  <rect x="28" y="52" width="8" height="4" fill="#5a2a0a"/>
  
  <!-- Guard (tsuba) - ornamental separator -->
  <rect x="20" y="36" width="24" height="4" fill="#a056d2"/>
  <rect x="22" y="37" width="20" height="2" fill="#8b3aa0"/>
</svg>