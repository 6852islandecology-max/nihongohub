<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Arita Porcelain Mace</title>
  
  <!-- Frame border (rare rarity color) -->
  <rect x="0" y="0" width="4" height="64" fill="#4d8fbf"/>
  <rect x="60" y="0" width="4" height="64" fill="#4d8fbf"/>
  <rect x="0" y="0" width="64" height="4" fill="#4d8fbf"/>
  <rect x="0" y="60" width="64" height="4" fill="#4d8fbf"/>
  
  <!-- Hammer head (porcelain white) -->
  <g>
    <!-- Left face of hammer head -->
    <rect x="16" y="8" width="4" height="4" fill="#f5f5f0"/>
    <rect x="12" y="12" width="4" height="4" fill="#f5f5f0"/>
    <rect x="12" y="16" width="4" height="4" fill="#f5f5f0"/>
    <rect x="16" y="12" width="4" height="4" fill="#f5f5f0"/>
    <rect x="16" y="16" width="4" height="4" fill="#f5f5f0"/>
    
    <!-- Center/top of hammer head -->
    <rect x="20" y="8" width="4" height="4" fill="#ffffff"/>
    <rect x="20" y="12" width="4" height="4" fill="#ffffff"/>
    <rect x="20" y="16" width="4" height="4" fill="#ffffff"/>
    <rect x="24" y="8" width="4" height="4" fill="#f5f5f0"/>
    <rect x="24" y="12" width="4" height="4" fill="#f5f5f0"/>
    <rect x="24" y="16" width="4" height="4" fill="#f5f5f0"/>
    
    <!-- Right face of hammer head -->
    <rect x="28" y="12" width="4" height="4" fill="#e8e8e0"/>
    <rect x="28" y="16" width="4" height="4" fill="#e8e8e0"/>
    <rect x="32" y="12" width="4" height="4" fill="#e8e8e0"/>
    <rect x="32" y="16" width="4" height="4" fill="#e8e8e0"/>
  </g>
  
  <!-- Handle/shaft (dark wood brown) -->
  <g>
    <rect x="20" y="20" width="4" height="4" fill="#8b6f47"/>
    <rect x="20" y="24" width="4" height="4" fill="#8b6f47"/>
    <rect x="20" y="28" width="4" height="4" fill="#a0855c"/>
    <rect x="20" y="32" width="4" height="4" fill="#8b6f47"/>
    <rect x="20" y="36" width="4" height="4" fill="#8b6f47"/>
    <rect x="20" y="40" width="4" height="4" fill="#a0855c"/>
  </g>
  
  <!-- Grip (darker accent) -->
  <g>
    <rect x="16" y="40" width="4" height="4" fill="#6b5438"/>
    <rect x="20" y="44" width="4" height="4" fill="#6b5438"/>
    <rect x="24" y="40" width="4" height="4" fill="#6b5438"/>
    <rect x="20" y="48" width="4" height="4" fill="#5a4430"/>
  </g>
  
  <!-- Porcelain glaze shine/pattern (subtle blue accent) -->
  <rect x="24" y="10" width="4" height="4" fill="#d4e8f7"/>
</svg>