<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Akiyoshido Cave Boots</title>
  
  <!-- Left Boot -->
  <g id="left-boot">
    <!-- Sole -->
    <rect x="4" y="44" width="16" height="4" fill="#5a5a5a"/>
    <!-- Boot body -->
    <rect x="6" y="36" width="12" height="8" fill="#8b7d6b"/>
    <!-- Boot upper -->
    <rect x="8" y="28" width="8" height="8" fill="#9b9285"/>
    <!-- Highlight/detail -->
    <rect x="10" y="32" width="4" height="4" fill="#b5aca3"/>
  </g>
  
  <!-- Right Boot -->
  <g id="right-boot">
    <!-- Sole -->
    <rect x="44" y="44" width="16" height="4" fill="#5a5a5a"/>
    <!-- Boot body -->
    <rect x="46" y="36" width="12" height="8" fill="#8b7d6b"/>
    <!-- Boot upper -->
    <rect x="48" y="28" width="8" height="8" fill="#9b9285"/>
    <!-- Highlight/detail -->
    <rect x="50" y="32" width="4" height="4" fill="#b5aca3"/>
  </g>
  
  <!-- Frame border accent -->
  <rect x="6" y="26" width="52" height="26" fill="none" stroke="#9b9285" stroke-width="2"/>
</svg>