<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Naruto Whirlpool Sandals</title>
  
  <!-- Left Sandal -->
  <g id="left-sandal">
    <!-- Sole -->
    <rect x="8" y="36" width="16" height="12" fill="#8B4513"/>
    
    <!-- Sole outline/frame -->
    <rect x="8" y="36" width="16" height="2" fill="#9b9285"/>
    <rect x="8" y="46" width="16" height="2" fill="#9b9285"/>
    <rect x="8" y="36" width="2" height="12" fill="#9b9285"/>
    <rect x="22" y="36" width="2" height="12" fill="#9b9285"/>
    
    <!-- Whirlpool pattern center -->
    <rect x="12" y="40" width="4" height="4" fill="#1E90FF"/>
    <rect x="13" y="41" width="2" height="2" fill="#87CEEB"/>
    
    <!-- Whirlpool spiral detail -->
    <rect x="10" y="38" width="2" height="2" fill="#4169E1"/>
    <rect x="18" y="42" width="2" height="2" fill="#4169E1"/>
    <rect x="12" y="44" width="2" height="2" fill="#4169E1"/>
    
    <!-- Strap -->
    <rect x="10" y="32" width="12" height="4" fill="#D2691E"/>
    <rect x="10" y="32" width="12" height="1" fill="#9b9285"/>
  </g>
  
  <!-- Right Sandal (mirrored) -->
  <g id="right-sandal">
    <!-- Sole -->
    <rect x="40" y="36" width="16" height="12" fill="#8B4513"/>
    
    <!-- Sole outline/frame -->
    <rect x="40" y="36" width="16" height="2" fill="#9b9285"/>
    <rect x="40" y="46" width="16" height="2" fill="#9b9285"/>
    <rect x="40" y="36" width="2" height="12" fill="#9b9285"/>
    <rect x="54" y="36" width="2" height="12" fill="#9b9285"/>
    
    <!-- Whirlpool pattern center -->
    <rect x="48" y="40" width="4" height="4" fill="#1E90FF"/>
    <rect x="49" y="41" width="2" height="2" fill="#87CEEB"/>
    
    <!-- Whirlpool spiral detail -->
    <rect x="46" y="38" width="2" height="2" fill="#4169E1"/>
    <rect x="54" y="42" width="2" height="2" fill="#4169E1"/>
    <rect x="48" y="44" width="2" height="2" fill="#4169E1"/>
    
    <!-- Strap -->
    <rect x="42" y="32" width="12" height="4" fill="#D2691E"/>
    <rect x="42" y="32" width="12" height="1" fill="#9b9285"/>
  </g>
</svg>