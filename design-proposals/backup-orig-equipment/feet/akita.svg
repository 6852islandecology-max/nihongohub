<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Kiritanpo Trekkers</title>
  
  <!-- Left sandal -->
  <g id="left-sandal">
    <!-- Sole -->
    <rect x="4" y="36" width="20" height="8" fill="#6b5d4f"/>
    <!-- Straps -->
    <rect x="6" y="32" width="4" height="8" fill="#9b9285"/>
    <rect x="12" y="30" width="4" height="10" fill="#9b9285"/>
    <rect x="18" y="32" width="4" height="8" fill="#9b9285"/>
    <!-- Decorative binding -->
    <rect x="4" y="34" width="20" height="2" fill="#d4a574"/>
  </g>
  
  <!-- Right sandal -->
  <g id="right-sandal">
    <!-- Sole -->
    <rect x="40" y="36" width="20" height="8" fill="#6b5d4f"/>
    <!-- Straps -->
    <rect x="42" y="32" width="4" height="8" fill="#9b9285"/>
    <rect x="48" y="30" width="4" height="10" fill="#9b9285"/>
    <rect x="54" y="32" width="4" height="8" fill="#9b9285"/>
    <!-- Decorative binding -->
    <rect x="40" y="34" width="20" height="2" fill="#d4a574"/>
  </g>
  
  <!-- Center frame accent -->
  <g id="frame">
    <rect x="28" y="44" width="8" height="4" fill="#9b9285" opacity="0.6"/>
  </g>
  
  <!-- Mountain-inspired detail (kiritanpo rice pattern) -->
  <rect x="8" y="28" width="2" height="4" fill="#c9a876"/>
  <rect x="14" y="26" width="2" height="6" fill="#c9a876"/>
  <rect x="48" y="28" width="2" height="4" fill="#c9a876"/>
  <rect x="54" y="26" width="2" height="6" fill="#c9a876"/>
</svg>