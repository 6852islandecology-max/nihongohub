<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Mt Nokogiri Climbing Boots</title>
  
  <!-- Left boot -->
  <g id="left-boot">
    <!-- Boot sole -->
    <rect x="4" y="40" width="16" height="4" fill="#3d3d3d"/>
    <!-- Boot upper -->
    <rect x="4" y="28" width="16" height="12" fill="#8b5a3c"/>
    <!-- Boot accent stripe -->
    <rect x="4" y="32" width="16" height="4" fill="#9b9285"/>
    <!-- Boot toe -->
    <rect x="4" y="24" width="16" height="4" fill="#6b4423"/>
    <!-- Lace pattern -->
    <rect x="8" y="28" width="4" height="4" fill="#9b9285"/>
    <rect x="12" y="32" width="4" height="4" fill="#9b9285"/>
  </g>
  
  <!-- Right boot -->
  <g id="right-boot">
    <!-- Boot sole -->
    <rect x="44" y="40" width="16" height="4" fill="#3d3d3d"/>
    <!-- Boot upper -->
    <rect x="44" y="28" width="16" height="12" fill="#8b5a3c"/>
    <!-- Boot accent stripe -->
    <rect x="44" y="32" width="16" height="4" fill="#9b9285"/>
    <!-- Boot toe -->
    <rect x="44" y="24" width="16" height="4" fill="#6b4423"/>
    <!-- Lace pattern -->
    <rect x="48" y="28" width="4" height="4" fill="#9b9285"/>
    <rect x="52" y="32" width="4" height="4" fill="#9b9285"/>
  </g>
  
  <!-- Climbing grips (saw-tooth pattern) -->
  <rect x="8" y="20" width="4" height="4" fill="#9b9285"/>
  <rect x="12" y="20" width="4" height="4" fill="#9b9285"/>
  <rect x="48" y="20" width="4" height="4" fill="#9b9285"/>
  <rect x="52" y="20" width="4" height="4" fill="#9b9285"/>
  
  <!-- Metal studs for grip -->
  <rect x="6" y="36" width="4" height="4" fill="#c9a876"/>
  <rect x="14" y="36" width="4" height="4" fill="#c9a876"/>
  <rect x="46" y="36" width="4" height="4" fill="#c9a876"/>
  <rect x="54" y="36" width="4" height="4" fill="#c9a876"/>
</svg>