<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Hida Beef Farmer Boots</title>
  <g id="boots">
    <!-- Left Boot -->
    <rect x="8" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="12" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="16" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="8" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="12" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="16" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="8" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="12" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="16" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="8" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="12" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="16" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="12" y="48" width="4" height="4" fill="#2a1810"/>
    <rect x="16" y="48" width="4" height="4" fill="#2a1810"/>
    <!-- Left Boot Sole -->
    <rect x="8" y="52" width="12" height="4" fill="#1a0f08"/>
    <!-- Left Boot Frame Accent -->
    <rect x="8" y="32" width="12" height="4" fill="#9b9285" opacity="0.4"/>
    
    <!-- Right Boot -->
    <rect x="40" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="44" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="48" y="32" width="4" height="4" fill="#3d2817"/>
    <rect x="40" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="44" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="48" y="36" width="4" height="4" fill="#5a4a3a"/>
    <rect x="40" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="44" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="48" y="40" width="4" height="4" fill="#5a4a3a"/>
    <rect x="40" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="44" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="48" y="44" width="4" height="4" fill="#3d2817"/>
    <rect x="44" y="48" width="4" height="4" fill="#2a1810"/>
    <rect x="48" y="48" width="4" height="4" fill="#2a1810"/>
    <!-- Right Boot Sole -->
    <rect x="40" y="52" width="12" height="4" fill="#1a0f08"/>
    <!-- Right Boot Frame Accent -->
    <rect x="40" y="32" width="12" height="4" fill="#9b9285" opacity="0.4"/>
