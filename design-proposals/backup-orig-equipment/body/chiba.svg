<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Peanut Farmer Robe</title>
  <g id="robe">
    <!-- Frame border -->
    <rect x="8" y="8" width="48" height="48" fill="none" stroke="#9b9285" stroke-width="2"/>
    
    <!-- Main robe body - tan/beige -->
    <rect x="16" y="12" width="32" height="28" fill="#d4c4a8"/>
    
    <!-- Left shoulder -->
    <rect x="12" y="12" width="8" height="8" fill="#d4c4a8"/>
    
    <!-- Right shoulder -->
    <rect x="44" y="12" width="8" height="8" fill="#d4c4a8"/>
    
    <!-- Left sleeve -->
    <rect x="8" y="20" width="8" height="12" fill="#c9b896"/>
    
    <!-- Right sleeve -->
    <rect x="48" y="20" width="8" height="12" fill="#c9b896"/>
    
    <!-- Center front opening - darker brown -->
    <rect x="28" y="16" width="8" height="20" fill="#8b7d6b"/>
    
    <!-- Left front panel detail -->
    <rect x="16" y="20" width="8" height="16" fill="#c9b896"/>
    
    <!-- Right front panel detail -->
    <rect x="40" y="20" width="8" height="16" fill="#c9b896"/>
    
    <!-- Peanut motif - left -->
    <rect x="20" y="24" width="4" height="4" fill="#9b6b3d"/>
    <rect x="20" y="28" width="4" height="4" fill="#a8754a"/>
    
    <!-- Peanut motif - right -->
    <rect x="40" y="24" width="4" height="4" fill="#9b6b3d"/>
    <rect x="40" y="28" width="4" height="4" fill="#a8754a"/>
    
    <!-- Waist tie detail -->
    <rect x="16" y="38" width="32" height="2" fill="#9b9285"/>
    
    <!-- Bottom hem -->
    <rect x="16" y="40" width="32" height="4" fill="#8b7d6b"/>
  </g>
</svg>