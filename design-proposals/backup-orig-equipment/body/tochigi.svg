<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
<title>Strawberry Field Cape</title>
<g id="cape">
<!-- Cape frame border -->
<rect x="8" y="8" width="48" height="4" fill="#9b9285"/>
<rect x="8" y="8" width="4" height="40" fill="#9b9285"/>
<rect x="52" y="8" width="4" height="40" fill="#9b9285"/>
<rect x="8" y="44" width="48" height="4" fill="#9b9285"/>

<!-- Main cape body - red/maroon -->
<rect x="12" y="12" width="40" height="32" fill="#c41e3a"/>

<!-- Strawberry accent pattern - top section -->
<rect x="16" y="16" width="8" height="8" fill="#d4534f"/>
<rect x="40" y="16" width="8" height="8" fill="#d4534f"/>

<!-- Seeds on strawberries -->
<rect x="18" y="18" width="4" height="4" fill="#f4e4c1"/>
<rect x="42" y="18" width="4" height="4" fill="#f4e4c1"/>

<!-- Green leaf accent - center top -->
<rect x="28" y="12" width="8" height="4" fill="#2d5016"/>

<!-- Cape drape shading -->
<rect x="12" y="24" width="4" height="16" fill="#a01729"/>
<rect x="48" y="24" width="4" height="16" fill="#a01729"/>

<!-- Center detail stripe -->
<rect x="30" y="20" width="4" height="20" fill="#f4e4c1"/>

<!-- Bottom berry clusters -->
<rect x="20" y="36" width="4" height="4" fill="#d4534f"/>
<rect x="40" y="36" width="4" height="4" fill="#d4534f"/>
<rect x="28" y="36" width="4" height="4" fill="#d4534f"/>
<rect x="32" y="36" width="4" height="4" fill="#d4534f"/>
</g>
</svg>