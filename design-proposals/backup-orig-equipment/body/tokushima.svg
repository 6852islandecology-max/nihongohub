<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Indigo Aizome Robe</title>
  
  <!-- Rarity frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="1"/>
  </g>
  
  <!-- Indigo robe body -->
  <g id="robe">
    <!-- Left shoulder/sleeve -->
    <rect x="12" y="12" width="8" height="4" fill="#1a3a52"/>
    <rect x="8" y="16" width="12" height="4" fill="#1a3a52"/>
    <rect x="8" y="20" width="12" height="20" fill="#1a3a52"/>
    
    <!-- Right shoulder/sleeve -->
    <rect x="44" y="12" width="8" height="4" fill="#1a3a52"/>
    <rect x="44" y="16" width="12" height="4" fill="#1a3a52"/>
    <rect x="44" y="20" width="12" height="20" fill="#1a3a52"/>
    
    <!-- Center chest panel -->
    <rect x="20" y="12" width="24" height="8" fill="#2856a3"/>
    <rect x="20" y="20" width="24" height="20" fill="#2856a3"/>
    
    <!-- Indigo dye pattern - horizontal stripes -->
    <rect x="12" y="24" width="40" height="2" fill="#0d1f35"/>
    <rect x="12" y="32" width="40" height="2" fill="#0d1f35"/>
    
    <!-- Collar/neckline detail -->
    <rect x="28" y="12" width="8" height="4" fill="#4a7bc4"/>
    
    <!-- Hem detail -->
    <rect x="12" y="40" width="40" height="2" fill="#a056d2"/>
    <rect x="12" y="42" width="40" height="2" fill="#1a3a52"/>
  </g>
  
  <!-- Highlights for depth -->
  <g id="highlights">
    <rect x="22" y="22" width="4" height="2" fill="#4a7bc4"/>
    <rect x="38" y="22" width="4" height="2" fill="#4a7bc4"/>
  </g>
</svg>