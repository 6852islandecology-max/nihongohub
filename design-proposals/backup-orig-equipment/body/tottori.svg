<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Gegege Yokai Cloak</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="0" y="0" width="64" height="64" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  </g>
  
  <!-- Cape/Cloak body - dark indigo base -->
  <g id="cloak">
    <!-- Left side of cape -->
    <rect x="4" y="12" width="4" height="4" fill="#2d1b4e"/>
    <rect x="0" y="16" width="8" height="4" fill="#2d1b4e"/>
    <rect x="0" y="20" width="12" height="4" fill="#2d1b4e"/>
    <rect x="4" y="24" width="12" height="4" fill="#2d1b4e"/>
    <rect x="8" y="28" width="8" height="4" fill="#2d1b4e"/>
    
    <!-- Center cape section -->
    <rect x="12" y="8" width="8" height="4" fill="#3d2b5e"/>
    <rect x="12" y="12" width="12" height="4" fill="#3d2b5e"/>
    <rect x="12" y="16" width="12" height="4" fill="#2d1b4e"/>
    <rect x="12" y="20" width="12" height="4" fill="#2d1b4e"/>
    <rect x="12" y="24" width="12" height="4" fill="#2d1b4e"/>
    <rect x="12" y="28" width="12" height="4" fill="#1d0b3e"/>
    
    <!-- Right side of cape -->
    <rect x="56" y="12" width="4" height="4" fill="#2d1b4e"/>
    <rect x="56" y="16" width="8" height="4" fill="#2d1b4e"/>
    <rect x="52" y="20" width="12" height="4" fill="#2d1b4e"/>
    <rect x="52" y="24" width="12" height="4" fill="#2d1b4e"/>
    <rect x="48" y="28" width="8" height="4" fill="#2d1b4e"/>
  </g>
  
  <!-- Accent details - yokai mystical elements -->
  <g id="accents">
    <!-- Left shoulder accent -->
    <rect x="8" y="12" width="4" height="4" fill="#4d8fbf"/>
    
    <!-- Center collar/neck area -->
    <rect x="28" y="8" width="8" height="4" fill="#4d8fbf"/>
    <rect x="24" y="12" width="16" height="4" fill="#3d5f8f"/>
    
    <!-- Right shoulder accent -->
    <rect x="52" y="12" width="4" height="4" fill="#4d8fbf"/>
    
    <!-- Mystical eye pattern - left -->
    <rect x="4" y="16" width="4" height="4" fill="#ffd700"/>
    
    <!-- Mystical eye pattern - right -->
    <rect x="56" y="16" width="4" height="4" fill="#ffd700"/>
    
    <!-- Center gem detail -->
    <rect x="28" y="20" width="4" height="4" fill="#ff6b9d"/>
    <rect x="32" y="20" width="4" height="4" fill="#ff6b9d"/>
  </g>
  
  <!-- Trim and edges -->
  <g id="trim">
    <rect x="8" y="8" width="4" height="4" fill="#4d8fbf"/>
    <rect x="52" y="8" width="4" height="4" fill="#4d8fbf"/>
  </g>
</svg>