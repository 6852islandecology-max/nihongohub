<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Ise Shinto Robe</title>
  
  <!-- Frame border in rare color -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  </g>
  
  <!-- Main robe body - white -->
  <g id="robe">
    <!-- Left side of robe -->
    <rect x="12" y="16" width="8" height="32" fill="#f5f5f0"/>
    <!-- Right side of robe -->
    <rect x="44" y="16" width="8" height="32" fill="#f5f5f0"/>
    <!-- Center panel -->
    <rect x="20" y="16" width="24" height="32" fill="#ffffff"/>
  </g>
  
  <!-- Robe collar - red accent (sacred shrine color) -->
  <g id="collar">
    <rect x="16" y="12" width="6" height="8" fill="#c41e3a"/>
    <rect x="42" y="12" width="6" height="8" fill="#c41e3a"/>
    <rect x="22" y="10" width="20" height="4" fill="#c41e3a"/>
  </g>
  
  <!-- Shoulders/upper robe definition -->
  <g id="shoulders">
    <rect x="14" y="16" width="4" height="6" fill="#e8e8e0"/>
    <rect x="46" y="16" width="4" height="6" fill="#e8e8e0"/>
  </g>
  
  <!-- Central vertical stripe (shrine formal detail) -->
  <g id="center-stripe">
    <rect x="30" y="16" width="4" height="28" fill="#4d8fbf"/>
  </g>
  
  <!-- Lower robe hem detail -->
  <g id="hem">
    <rect x="12" y="44" width="40" height="4" fill="#e8e8e0"/>
  </g>
  
  <!-- Sleeves suggestion -->
  <g id="sleeves">
    <rect x="8" y="18" width="4" height="16" fill="#f5f5f0"/>
    <rect x="52" y="18" width="4" height="16" fill="#f5f5f0"/>
  </g>
</svg>