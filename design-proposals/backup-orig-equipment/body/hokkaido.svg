<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Bear Pelt Coat</title>
  
  <!-- Brown pelt body -->
  <rect x="20" y="16" width="24" height="28" fill="#6b4423"/>
  
  <!-- Dark brown shading sides -->
  <rect x="16" y="20" width="4" height="20" fill="#4a2f1a"/>
  <rect x="44" y="20" width="4" height="20" fill="#4a2f1a"/>
  
  <!-- Lighter brown highlight center -->
  <rect x="24" y="20" width="16" height="4" fill="#8b5a2b"/>
  
  <!-- Rare frame border - blue accent -->
  <rect x="12" y="12" width="40" height="36" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Left shoulder fur tuft -->
  <rect x="12" y="16" width="8" height="8" fill="#5a3d2a"/>
  <rect x="12" y="16" width="4" height="4" fill="#6b4423"/>
  
  <!-- Right shoulder fur tuft -->
  <rect x="44" y="16" width="8" height="8" fill="#5a3d2a"/>
  <rect x="48" y="16" width="4" height="4" fill="#6b4423"/>
  
  <!-- Fur texture dots -->
  <rect x="24" y="28" width="4" height="4" fill="#5a3d2a"/>
  <rect x="36" y="28" width="4" height="4" fill="#5a3d2a"/>
  <rect x="28" y="36" width="4" height="4" fill="#5a3d2a"/>
  <rect x="32" y="36" width="4" height="4" fill="#5a3d2a"/>
  
  <!-- Waist cinch accent in blue (rare) -->
  <rect x="16" y="40" width="32" height="2" fill="#4d8fbf"/>
  
  <!-- Lower coat flare -->
  <rect x="14" y="42" width="36" height="4" fill="#6b4423"/>
  
  <!-- Hem detail -->
  <rect x="16" y="44" width="32" height="2" fill="#4d8fbf"/>
</svg>