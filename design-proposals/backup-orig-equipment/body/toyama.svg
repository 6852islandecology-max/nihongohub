<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Gokayama Gassho Robe</title>
  <g id="robe">
    <!-- Frame border accent -->
    <rect x="12" y="8" width="40" height="44" fill="none" stroke="#9b9285" stroke-width="2"/>
    
    <!-- Main robe body - cream/beige base -->
    <rect x="16" y="12" width="32" height="36" fill="#d4c5a9"/>
    
    <!-- Left shoulder panel -->
    <rect x="12" y="12" width="8" height="20" fill="#c4b59a"/>
    
    <!-- Right shoulder panel -->
    <rect x="44" y="12" width="8" height="20" fill="#c4b59a"/>
    
    <!-- Gassho (steep roof) fold pattern - left side -->
    <rect x="16" y="12" width="4" height="8" fill="#9b8f7e"/>
    <rect x="20" y="16" width="4" height="4" fill="#8a7f6e"/>
    
    <!-- Gassho fold pattern - right side -->
    <rect x="44" y="12" width="4" height="8" fill="#9b8f7e"/>
    <rect x="40" y="16" width="4" height="4" fill="#8a7f6e"/>
    
    <!-- Center front seam -->
    <rect x="30" y="12" width="4" height="28" fill="#9b8f7e"/>
    
    <!-- Lower robe panels -->
    <rect x="16" y="28" width="8" height="20" fill="#b8a994"/>
    <rect x="40" y="28" width="8" height="20" fill="#b8a994"/>
    
    <!-- Decorative trim at waist -->
    <rect x="14" y="28" width="36" height="4" fill="#9b9285"/>
    
    <!-- Sleeve cuff details - left -->
    <rect x="12" y="20" width="4" height="8" fill="#8a7f6e"/>
    
    <!-- Sleeve cuff details - right -->
    <rect x="52" y="20" width="4" height="8" fill="#8a7f6e"/>
    
    <!-- Highlight accent - upper center -->
    <rect x="28" y="16" width="8" height="4" fill="#e8dcc8"/>
  </g>
</svg>