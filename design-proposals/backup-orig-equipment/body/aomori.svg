<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Tsugaru Robe</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Robe body - dark lacquered base -->
  <g id="robe">
    <!-- Left shoulder/sleeve -->
    <rect x="8" y="12" width="8" height="4" fill="#2d2416"/>
    <rect x="4" y="16" width="8" height="4" fill="#2d2416"/>
    <rect x="8" y="20" width="8" height="4" fill="#2d2416"/>
    
    <!-- Center chest panel -->
    <rect x="16" y="12" width="32" height="4" fill="#3d3426"/>
    <rect x="16" y="16" width="32" height="4" fill="#3d3426"/>
    
    <!-- Right shoulder/sleeve -->
    <rect x="48" y="12" width="8" height="4" fill="#2d2416"/>
    <rect x="52" y="16" width="8" height="4" fill="#2d2416"/>
    <rect x="48" y="20" width="8" height="4" fill="#2d2416"/>
    
    <!-- Left skirt panel -->
    <rect x="8" y="20" width="12" height="4" fill="#3d3426"/>
    <rect x="4" y="24" width="16" height="4" fill="#3d3426"/>
    <rect x="4" y="28" width="16" height="4" fill="#2d2416"/>
    <rect x="8" y="32" width="12" height="4" fill="#2d2416"/>
    
    <!-- Center skirt -->
    <rect x="20" y="20" width="24" height="4" fill="#3d3426"/>
    <rect x="16" y="24" width="32" height="4" fill="#3d3426"/>
    <rect x="16" y="28" width="32" height="4" fill="#2d2416"/>
    <rect x="20" y="32" width="24" height="4" fill="#2d2416"/>
    
    <!-- Right skirt panel -->
    <rect x="44" y="20" width="12" height="4" fill="#3d3426"/>
    <rect x="44" y="24" width="16" height="4" fill="#3d3426"/>
    <rect x="44" y="28" width="16" height="4" fill="#2d2416"/>
    <rect x="44" y="32" width="12" height="4" fill="#2d2416"/>
  </g>
  
  <!-- Lacquer accent stripes (Tsugaru design) -->
  <g id="lacquer_accent">
    <rect x="20" y="16" width="4" height="4" fill="#8b6f47"/>
    <rect x="40" y="16" width="4" height="4" fill="#8b6f47"/>
    <rect x="16" y="24" width="4" height="4" fill="#a08560"/>
    <rect x="44" y="24" width="4" height="4" fill="#a08560"/>
  </g>
  
  <!-- Collar detail -->
  <g id="collar">
    <rect x="20" y="8" width="8" height="4" fill="#9b9285"/>
    <rect x="36" y="8" width="8" height="4" fill="#9b9285"/>
  </g>
</svg>