<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Yokohama Sailor Coat</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="0" y="0" width="64" height="64" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Sailor coat body -->
  <g id="coat">
    <!-- Main coat body - navy blue -->
    <rect x="12" y="12" width="40" height="32" fill="#1a3a5c"/>
    
    <!-- Left shoulder -->
    <rect x="8" y="12" width="8" height="8" fill="#1a3a5c"/>
    
    <!-- Right shoulder -->
    <rect x="48" y="12" width="8" height="8" fill="#1a3a5c"/>
    
    <!-- Sailor collar - white -->
    <rect x="20" y="8" width="24" height="8" fill="#ffffff"/>
    <rect x="22" y="12" width="20" height="4" fill="#ffffff"/>
    
    <!-- Collar stripes - navy trim -->
    <rect x="20" y="8" width="24" height="2" fill="#1a3a5c"/>
    <rect x="20" y="14" width="24" height="1" fill="#1a3a5c"/>
    
    <!-- Center button line -->
    <rect x="30" y="20" width="4" height="16" fill="#d4af37"/>
    
    <!-- Buttons -->
    <rect x="30" y="20" width="4" height="4" fill="#c4912f"/>
    <rect x="30" y="28" width="4" height="4" fill="#c4912f"/>
    
    <!-- Left side seam -->
    <rect x="18" y="16" width="2" height="20" fill="#0f2340"/>
    
    <!-- Right side seam -->
    <rect x="44" y="16" width="2" height="20" fill="#0f2340"/>
    
    <!-- Shoulder boards - red accent -->
    <rect x="12" y="10" width="4" height="6" fill="#c41e3a"/>
    <rect x="48" y="10" width="4" height="6" fill="#c41e3a"/>
    
    <!-- Coat hem -->
    <rect x="12" y="40" width="40" height="4" fill="#0f2340"/>
    
    <!-- Sleeve cuffs left -->
    <rect x="8" y="36" width="8" height="6" fill="#1a3a5c"/>
    <rect x="8" y="40" width="8" height="2" fill="#ffffff"/>
    
    <!-- Sleeve cuffs right -->
    <rect x="48" y="36" width="8" height="6" fill="#1a3a5c"/>
    <rect x="48" y="40" width="8" height="2" fill="#ffffff"/>
  </g>
</svg>