<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Grape-vineyard Cloak</title>
  
  <!-- Outer frame/border -->
  <g id="frame">
    <rect x="8" y="8" width="48" height="48" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Main cloak body - deep purple/wine color -->
  <g id="cloak">
    <!-- Left shoulder/sleeve -->
    <rect x="12" y="16" width="8" height="4" fill="#4a2c5e"/>
    <rect x="8" y="20" width="12" height="4" fill="#4a2c5e"/>
    <rect x="8" y="24" width="12" height="20" fill="#4a2c5e"/>
    
    <!-- Right shoulder/sleeve -->
    <rect x="44" y="16" width="8" height="4" fill="#4a2c5e"/>
    <rect x="44" y="20" width="12" height="4" fill="#4a2c5e"/>
    <rect x="44" y="24" width="12" height="20" fill="#4a2c5e"/>
    
    <!-- Center chest panel -->
    <rect x="24" y="16" width="16" height="28" fill="#5a3c6e"/>
  </g>
  
  <!-- Grape vine details - gold/tan accent -->
  <g id="vines">
    <rect x="20" y="20" width="4" height="4" fill="#9b9285"/>
    <rect x="28" y="24" width="4" height="4" fill="#9b9285"/>
    <rect x="36" y="20" width="4" height="4" fill="#9b9285"/>
    <rect x="24" y="32" width="4" height="4" fill="#9b9285"/>
    <rect x="36" y="32" width="4" height="4" fill="#9b9285"/>
  </g>
  
  <!-- Grape clusters - purple grapes -->
  <g id="grapes">
    <rect x="18" y="22" width="4" height="4" fill="#6b4c7e"/>
    <rect x="42" y="22" width="4" height="4" fill="#6b4c7e"/>
    <rect x="26" y="28" width="4" height="4" fill="#6b4c7e"/>
    <rect x="34" y="28" width="4" height="4" fill="#6b4c7e"/>
    <rect x="28" y="36" width="4" height="4" fill="#6b4c7e"/>
    <rect x="32" y="36" width="4" height="4" fill="#6b4c7e"/>
  </g>
  
  <!-- Collar highlight - cream -->
  <g id="collar">
    <rect x="28" y="14" width="8" height="4" fill="#d4c5a9"/>
  </g>
  
  <!-- Bottom hem detail -->
  <g id="hem">
    <rect x="20" y="44" width="24" height="4" fill="#3a1c4e"/>
  </g>
</svg>