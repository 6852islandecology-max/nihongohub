<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Wajima Lacquer Armor</title>
  
  <!-- Epic frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="2"/>
  </g>
  
  <!-- Black lacquer armor body -->
  <g id="armor">
    <!-- Main chest plate -->
    <rect x="16" y="16" width="32" height="24" fill="#0a0a0a"/>
    
    <!-- Lacquer shine - dark purple gradient effect -->
    <rect x="16" y="16" width="32" height="4" fill="#1a0a2e"/>
    
    <!-- Left shoulder guard -->
    <rect x="8" y="16" width="8" height="12" fill="#0a0a0a"/>
    <rect x="8" y="16" width="8" height="2" fill="#1a0a2e"/>
    
    <!-- Right shoulder guard -->
    <rect x="48" y="16" width="8" height="12" fill="#0a0a0a"/>
    <rect x="48" y="16" width="8" height="2" fill="#1a0a2e"/>
    
    <!-- Center chest ornament - lacquer accent -->
    <rect x="28" y="20" width="8" height="8" fill="#a056d2"/>
    <rect x="30" y="22" width="4" height="4" fill="#d4a5e8"/>
    
    <!-- Left side panel -->
    <rect x="12" y="24" width="4" height="12" fill="#0a0a0a"/>
    
    <!-- Right side panel -->
    <rect x="48" y="24" width="4" height="12" fill="#0a0a0a"/>
    
    <!-- Waist detail -->
    <rect x="16" y="38" width="32" height="2" fill="#a056d2"/>
    <rect x="16" y="40" width="32" height="4" fill="#1a0a2e"/>
    
    <!-- Bottom skirt section -->
    <rect x="12" y="44" width="40" height="4" fill="#0a0a0a"/>
    <rect x="10" y="48" width="44" height="4" fill="#1a0a2e"/>
  </g>
</svg>