<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Tosa Hineri Coat</title>
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  <g id="coat">
    <!-- Left shoulder -->
    <rect x="8" y="12" width="4" height="4" fill="#8B4513"/>
    <rect x="12" y="8" width="4" height="4" fill="#8B4513"/>
    <rect x="16" y="8" width="4" height="4" fill="#8B4513"/>
    <!-- Right shoulder -->
    <rect x="36" y="8" width="4" height="4" fill="#8B4513"/>
    <rect x="40" y="8" width="4" height="4" fill="#8B4513"/>
    <rect x="44" y="12" width="4" height="4" fill="#8B4513"/>
    <!-- Upper chest left -->
    <rect x="12" y="12" width="4" height="4" fill="#D4A373"/>
    <rect x="16" y="12" width="4" height="4" fill="#D4A373"/>
    <!-- Upper chest right -->
    <rect x="32" y="12" width="4" height="4" fill="#D4A373"/>
    <rect x="36" y="12" width="4" height="4" fill="#D4A373"/>
    <!-- Center chest panel -->
    <rect x="28" y="12" width="4" height="4" fill="#6B3410"/>
    <rect x="24" y="16" width="4" height="4" fill="#6B3410"/>
    <rect x="28" y="16" width="4" height="4" fill="#6B3410"/>
    <rect x="32" y="16" width="4" height="4" fill="#6B3410"/>
    <rect x="36" y="16" width="4" height="4" fill="#6B3410"/>
    <!-- Left sleeve -->
    <rect x="8" y="16" width="4" height="8" fill="#8B4513"/>
    <rect x="12" y="20" width="4" height="8" fill="#8B4513"/>
    <!-- Right sleeve -->
    <rect x="40" y="16" width="4" height="8" fill="#8B4513"/>
    <rect x="44" y="20" width="4" height="8" fill="#8B4513"/>
    <!-- Torso left -->
    <rect x="12" y="20" width="4" height="12" fill="#D4A373"/>
    <rect x="16" y="20" width="4" height="12" fill="#D4A373"/>
    <!-- Torso center -->
    <rect x="24" y="20" width="4" height="12" fill="#6B3410"/>
    <rect x="28" y="20" width="4" height="12" fill="#6B3410"/>
    <rect x="32" y="20" width="4" height="12" fill="#6B3410"/>
    <rect x="36" y="20" width="4" height="12" fill="#6B3410"/>
    <!-- Torso right -->
    <rect x="40" y="20" width="4" height="12" fill="#D4A373"/>
    <rect x="44" y="20" width="4" height="12" fill="#D4A373"/>
    <!-- Lower hem left -->
    <rect x="12" y="32" width="4" height="4" fill="#8B4513"/>
    <rect x="16" y="32" width="4" height="4" fill="#8B4513"/>
    <!-- Lower hem center -->
    <rect x="24" y="32" width="4" height="4" fill="#6B3410"/>
    <rect x="28" y="32" width="4" height="4" fill="#6B3410"/>
    <rect x="32" y="32" width="4" height="4" fill="#6B3410"/>
    <rect x="36" y="32" width="4" height="4" fill="#6B3410"/>
    <!-- Lower hem right -->
    <rect x="40" y="32" width="4" height="4" fill="#8B4513"/>
    <rect x="44" y="32" width="4" height="4" fill="#8B4513"/>
    <!-- Trim detail left -->
    <rect x="16" y="16" width="4" height="4" fill="#9b9285"/>
    <!-- Trim detail right -->
    <rect x="36" y="16" width="4" height="4" fill="#9b9285"/>
  </g>
</svg>