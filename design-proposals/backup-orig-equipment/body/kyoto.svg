<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Nishijin Brocade Robe</title>
  
  <!-- Gold/legendary border frame -->
  <g id="border">
    <rect x="8" y="4" width="48" height="56" fill="none" stroke="#e0a634" stroke-width="2"/>
  </g>
  
  <!-- Main robe body - deep crimson -->
  <g id="robe">
    <!-- Left shoulder -->
    <rect x="12" y="12" width="8" height="4" fill="#8b1428"/>
    <rect x="12" y="16" width="8" height="4" fill="#8b1428"/>
    
    <!-- Center chest area -->
    <rect x="20" y="8" width="24" height="4" fill="#a81c3a"/>
    <rect x="20" y="12" width="24" height="4" fill="#a81c3a"/>
    <rect x="20" y="16" width="24" height="4" fill="#a81c3a"/>
    
    <!-- Right shoulder -->
    <rect x="44" y="12" width="8" height="4" fill="#8b1428"/>
    <rect x="44" y="16" width="8" height="4" fill="#8b1428"/>
    
    <!-- Left sleeve upper -->
    <rect x="8" y="20" width="4" height="8" fill="#6b0f1f"/>
    <rect x="12" y="20" width="4" height="8" fill="#8b1428"/>
    
    <!-- Right sleeve upper -->
    <rect x="44" y="20" width="4" height="8" fill="#8b1428"/>
    <rect x="48" y="20" width="4" height="8" fill="#6b0f1f"/>
    
    <!-- Main torso body -->
    <rect x="16" y="20" width="32" height="24" fill="#a81c3a"/>
    
    <!-- Gold brocade pattern - vertical stripe left -->
    <rect x="22" y="24" width="4" height="4" fill="#e0a634"/>
    <rect x="22" y="32" width="4" height="4" fill="#e0a634"/>
    <rect x="22" y="40" width="4" height="4" fill="#e0a634"/>
    
    <!-- Gold brocade pattern - center diamond -->
    <rect x="28" y="28" width="4" height="4" fill="#e0a634"/>
    <rect x="32" y="28" width="4" height="4" fill="#e0a634"/>
    <rect x="28" y="32" width="4" height="4" fill="#e0a634"/>
    <rect x="32" y="32" width="4" height="4" fill="#e0a634"/>
    
    <!-- Gold brocade pattern - vertical stripe right -->
    <rect x="38" y="24" width="4" height="4" fill="#e0a634"/>
    <rect x="38" y="32" width="4" height="4" fill="#e0a634"/>
    <rect x="38" y="40" width="4" height="4" fill="#e0a634"/>
    
    <!-- Lower robe section -->
    <rect x="16" y="44" width="32" height="12" fill="#8b1428"/>
    
    <!-- Gold hem accent -->
    <rect x="16" y="56" width="32" height="4" fill="#e0a634"/>
  </g>
  
  <!-- Left sleeve lower -->
  <rect x="8" y="28" width="4" height="12" fill="#6b0f1f"/>
  
  <!-- Right sleeve lower -->
  <rect x="52" y="28" width="4" height="12" fill="#6b0f1f"/>
</svg>