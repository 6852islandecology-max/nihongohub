<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Biwa Pearl Robe</title>
  <g id="robe">
    <!-- Main robe body - deep indigo -->
    <rect x="16" y="16" width="32" height="36" fill="#2c3e50"/>
    
    <!-- Left shoulder -->
    <rect x="12" y="16" width="8" height="8" fill="#2c3e50"/>
    <!-- Right shoulder -->
    <rect x="44" y="16" width="8" height="8" fill="#2c3e50"/>
    
    <!-- Robe center seam line -->
    <rect x="28" y="16" width="8" height="32" fill="#1a2332"/>
    
    <!-- Left panel -->
    <rect x="16" y="20" width="12" height="28" fill="#3d5a7a"/>
    <!-- Right panel -->
    <rect x="36" y="20" width="12" height="28" fill="#3d5a7a"/>
    
    <!-- Pearl trim - left shoulder -->
    <rect x="12" y="12" width="4" height="4" fill="#f0e8d8"/>
    <rect x="12" y="16" width="4" height="4" fill="#e8dcc8"/>
    
    <!-- Pearl trim - right shoulder -->
    <rect x="48" y="12" width="4" height="4" fill="#f0e8d8"/>
    <rect x="48" y="16" width="4" height="4" fill="#e8dcc8"/>
    
    <!-- Pearl trim - neckline -->
    <rect x="24" y="16" width="4" height="4" fill="#f0e8d8"/>
    <rect x="36" y="16" width="4" height="4" fill="#f0e8d8"/>
    
    <!-- Accent pearls on chest -->
    <rect x="20" y="24" width="4" height="4" fill="#f0e8d8"/>
    <rect x="40" y="24" width="4" height="4" fill="#f0e8d8"/>
    <rect x="28" y="28" width="8" height="4" fill="#e8dcc8"/>
    
    <!-- Hem detail -->
    <rect x="16" y="48" width="32" height="4" fill="#4d8fbf"/>
    
    <!-- Pearl accent at hem -->
    <rect x="24" y="48" width="4" height="4" fill="#f0e8d8"/>
    <rect x="36" y="48" width="4" height="4" fill="#f0e8d8"/>
    
    <!-- Rarity frame accent - borders -->
    <rect x="14" y="14" width="4" height="40" fill="#4d8fbf"/>
    <rect x="46" y="14" width="4" height="40" fill="#4d8fbf"/>
  </g>
</svg>