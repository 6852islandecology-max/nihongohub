<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Hagi Pottery Robe</title>
  
  <!-- Frame/Border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Pottery base color (warm beige/cream) -->
  <g id="robe">
    <!-- Left shoulder -->
    <rect x="12" y="12" width="8" height="4" fill="#d4a574"/>
    <rect x="12" y="16" width="4" height="8" fill="#d4a574"/>
    
    <!-- Right shoulder -->
    <rect x="44" y="12" width="8" height="4" fill="#d4a574"/>
    <rect x="48" y="16" width="4" height="8" fill="#d4a574"/>
    
    <!-- Main body - center robe -->
    <rect x="16" y="12" width="12" height="4" fill="#c99860"/>
    <rect x="14" y="16" width="16" height="4" fill="#c99860"/>
    <rect x="12" y="20" width="20" height="12" fill="#c99860"/>
    <rect x="14" y="32" width="16" height="8" fill="#d4a574"/>
    <rect x="16" y="40" width="12" height="6" fill="#c99860"/>
    
    <!-- Left sleeve extension -->
    <rect x="8" y="20" width="4" height="8" fill="#b8845a"/>
    <rect x="4" y="24" width="4" height="4" fill="#b8845a"/>
    
    <!-- Right sleeve extension -->
    <rect x="52" y="20" width="4" height="8" fill="#b8845a"/>
    <rect x="56" y="24" width="4" height="4" fill="#b8845a"/>
  </g>
  
  <!-- Pottery texture/aging marks in darker brown -->
  <g id="aging" opacity="0.6">
    <rect x="18" y="24" width="4" height="4" fill="#8b6f47"/>
    <rect x="42" y="26" width="4" height="4" fill="#8b6f47"/>
    <rect x="28" y="32" width="4" height="4" fill="#8b6f47"/>
    <rect x="20" y="36" width="4" height="2" fill="#8b6f47"/>
    <rect x="40" y="34" width="4" height="2" fill="#8b6f47"/>
  </g>
  
  <!-- Accent trim (darker pottery rim) -->
  <g id="trim" stroke="#4d8fbf" stroke-width="1" fill="none">
    <rect x="12" y="12" width="20" height="4"/>
    <rect x="12" y="32" width="20" height="8"/>
  </g>
</svg>