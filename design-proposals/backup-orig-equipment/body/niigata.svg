<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Echigo Cotton Cloak</title>
  
  <!-- Frame border (rarity color) -->
  <rect x="0" y="0" width="64" height="64" fill="none" stroke="#9b9285" stroke-width="2"/>
  
  <!-- Cloak body - main woven fabric (beige/cream) -->
  <g id="cloak">
    <!-- Left shoulder/arm area -->
    <rect x="8" y="12" width="4" height="4" fill="#d4c5b0"/>
    <rect x="12" y="8" width="4" height="4" fill="#d4c5b0"/>
    <rect x="16" y="8" width="4" height="4" fill="#c9baa5"/>
    
    <!-- Right shoulder/arm area (mirrored) -->
    <rect x="44" y="12" width="4" height="4" fill="#d4c5b0"/>
    <rect x="48" y="8" width="4" height="4" fill="#d4c5b0"/>
    <rect x="44" y="8" width="4" height="4" fill="#c9baa5"/>
    
    <!-- Main cloak body - center chest -->
    <rect x="20" y="8" width="4" height="4" fill="#c9baa5"/>
    <rect x="24" y="8" width="4" height="4" fill="#c9baa5"/>
    <rect x="28" y="8" width="4" height="4" width="8" height="4" fill="#c9baa5"/>
    <rect x="28" y="8" width="4" height="4" fill="#c9baa5"/>
    <rect x="32" y="8" width="4" height="4" fill="#c9baa5"/>
    
    <!-- Upper cloak panel -->
    <rect x="12" y="12" width="4" height="4" fill="#d4c5b0"/>
    <rect x="16" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="20" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="24" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="28" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="32" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="36" y="12" width="4" height="4" fill="#c9baa5"/>
    <rect x="40" y="12" width="4" height="4" fill="#d4c5b0"/>
    <rect x="44" y="12" width="4" height="4" fill="#d4c5b0"/>
    
    <!-- Middle section -->
    <rect x="8" y="16" width="4" height="4" fill="#b8a892"/>
    <rect x="12" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="16" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="20" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="24" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="28" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="32" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="36" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="40" y="16" width="4" height="4" fill="#c9baa5"/>
    <rect x="44" y="16" width="4" height="4" fill="#b8a892"/>
    <rect x="48" y="16" width="4" height="4" fill="#b8a892"/>
    
    <!-- Lower cloak drape -->
    <rect x="4" y="20" width="4" height="4" fill="#a89880"/>
    <rect x="8" y="20" width="4" height="4" fill="#b8a892"/>
    <rect x="12" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="16" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="20" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="24" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="28" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="32" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="36" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="40" y="20" width="4" height="4" fill="#c9baa5"/>
    <rect x="44" y="20" width="4" height="4" fill="#b8a892"/>
    <rect x="48" y="20" width="4" height="4" fill="#b8a892"/>
    <rect x="52" y="20" width="4" height="4" fill="#a89880"/>
    
    <!-- Bottom hem detail (darker) -->
    <rect x="8" y="24" width="4" height="4" fill="#a89880"/>
    <rect x="12" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="16" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="20" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="24" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="28" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="32" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="36" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="40" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="44" y="24" width="4" height="4" fill="#b8a892"/>
    <rect x="48" y="24" width="4" height="4" fill="#a89880"/>
  </g>
  
  <!-- Weave texture accent lines (subtle) -->
  <g id="texture" opacity="0.6">
    <rect x="16" y="12" width="4" height="4" fill="#9b9285"/>
    <rect x="36" y="12" width="4" height="4" fill="#9b9285"/>
    <rect x="20" y="20" width="4" height="4" fill="#9b9285"/>
    <rect x="32" y="20" width="4" height="4" fill="#9b9285"/>
  </g>
</svg>