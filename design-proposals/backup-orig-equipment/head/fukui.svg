<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Wakasa Lacquered Helm</title>
  
  <!-- Frame border (rare) -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  
  <!-- Dark lacquer base -->
  <g id="helm">
    <!-- Main helm body - dark brown/black lacquer -->
    <rect x="12" y="16" width="40" height="28" fill="#1a1a1a"/>
    
    <!-- Curved top section -->
    <rect x="16" y="12" width="32" height="4" fill="#1a1a1a"/>
    <rect x="12" y="16" width="8" height="4" fill="#1a1a1a"/>
    <rect x="44" y="16" width="8" height="4" fill="#1a1a1a"/>
    
    <!-- Face guard -->
    <rect x="20" y="28" width="24" height="12" fill="#0d0d0d"/>
    
    <!-- Eye openings with rare frame accent -->
    <rect x="22" y="30" width="6" height="6" fill="#4d8fbf"/>
    <rect x="24" y="32" width="2" height="2" fill="#1a1a1a"/>
    
    <rect x="36" y="30" width="6" height="6" fill="#4d8fbf"/>
    <rect x="38" y="32" width="2" height="2" fill="#1a1a1a"/>
    
    <!-- Sea-shell inlay details - left side -->
    <rect x="14" y="18" width="4" height="4" fill="#e8d5c4"/>
    <rect x="16" y="20" width="2" height="2" fill="#d4c5b0"/>
    <rect x="14" y="24" width="4" height="4" fill="#f0ddd0"/>
    
    <!-- Sea-shell inlay details - right side (mirror) -->
    <rect x="36" y="18" width="4" height="4" fill="#e8d5c4"/>
    <rect x="34" y="20" width="2" height="2" fill="#d4c5b0"/>
    <rect x="36" y="24" width="4" height="4" fill="#f0ddd0"/>
    
    <!-- Center crest detail -->
    <rect x="28" y="8" width="8" height="4" fill="#4d8fbf"/>
    <rect x="30" y="4" width="4" height="4" fill="#6ba3d4"/>
    
    <!-- Shell pattern on face guard -->
    <rect x="24" y="36" width="4" height="2" fill="#e8d5c4"/>
    <rect x="36" y="36" width="4" height="2" fill="#e8d5c4"/>
    
    <!-- Glossy lacquer reflection highlights -->
    <rect x="20" y="14" width="2" height="2" fill="#2a2a2a"/>
    <rect x="42" y="14" width="2" height="2" fill="#2a2a2a"/>
  </g>
</svg>