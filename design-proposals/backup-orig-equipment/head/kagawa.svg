<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Konpira Pilgrim Hood</title>
  
  <!-- Outer frame/border in rarity color -->
  <g id="frame">
    <rect x="16" y="8" width="32" height="40" fill="none" stroke="#4d8fbf" stroke-width="2"/>
  </g>
  
  <!-- Hood main body - cream/off-white -->
  <g id="hood_body">
    <rect x="20" y="12" width="24" height="28" fill="#f5e6d3"/>
  </g>
  
  <!-- Hood peak/top curve - darker brown -->
  <g id="hood_top">
    <rect x="20" y="12" width="6" height="4" fill="#8b6f47"/>
    <rect x="26" y="8" width="12" height="4" fill="#8b6f47"/>
    <rect x="38" y="12" width="6" height="4" fill="#8b6f47"/>
  </g>
  
  <!-- Face opening - dark shadow -->
  <g id="face_opening">
    <rect x="24" y="20" width="16" height="12" fill="#2a2a2a"/>
  </g>
  
  <!-- Eye holes left -->
  <g id="eyes">
    <rect x="28" y="24" width="3" height="3" fill="#1a1a1a"/>
    <rect x="36" y="24" width="3" height="3" fill="#1a1a1a"/>
  </g>
  
  <!-- Nose opening -->
  <g id="nose">
    <rect x="31" y="28" width="2" height="2" fill="#1a1a1a"/>
  </g>
  
  <!-- Staircase pattern accent (1368 stairs reference) -->
  <g id="stair_pattern">
    <rect x="20" y="32" width="4" height="4" fill="#4d8fbf"/>
    <rect x="28" y="32" width="4" height="4" fill="#4d8fbf"/>
    <rect x="36" y="32" width="4" height="4" fill="#4d8fbf"/>
    <rect x="24" y="36" width="4" height="4" fill="#4d8fbf"/>
    <rect x="32" y="36" width="4" height="4" fill="#4d8fbf"/>
  </g>
  
  <!-- Chin/lower hood curve -->
  <g id="hood_bottom">
    <rect x="20" y="40" width="24" height="4" fill="#e0d4c1"/>
  </g>
  
  <!-- Fabric drape sides -->
  <g id="drape">
    <rect x="16" y="32" width="4" height="12" fill="#d4c4b0"/>
    <rect x="44" y="32" width="4" height="12" fill="#d4c4b0"/>
  </g>
</svg>