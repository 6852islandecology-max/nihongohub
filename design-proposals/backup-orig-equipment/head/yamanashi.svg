<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Takeda Shingen Helm</title>
  
  <!-- Gold frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#e0a634" stroke-width="2"/>
  </g>
  
  <!-- Main helm body - dark metal -->
  <g id="helm">
    <!-- Top crest -->
    <rect x="24" y="8" width="16" height="4" fill="#1a1a1a"/>
    <rect x="20" y="12" width="24" height="4" fill="#1a1a1a"/>
    
    <!-- Main face plate - dark with gold accent -->
    <rect x="16" y="16" width="32" height="20" fill="#2d2d2d"/>
    <rect x="16" y="16" width="32" height="2" fill="#e0a634"/>
    
    <!-- Eye openings -->
    <rect x="20" y="20" width="6" height="8" fill="#0a0a0a"/>
    <rect x="38" y="20" width="6" height="8" fill="#0a0a0a"/>
    
    <!-- Tiger stripe details on face - orange/brown -->
    <rect x="18" y="24" width="3" height="6" fill="#cc6600"/>
    <rect x="26" y="22" width="2" height="8" fill="#cc6600"/>
    <rect x="36" y="22" width="2" height="8" fill="#cc6600"/>
    <rect x="44" y="24" width="3" height="6" fill="#cc6600"/>
    
    <!-- Nose guard -->
    <rect x="28" y="28" width="8" height="4" fill="#1a1a1a"/>
    <rect x="30" y="32" width="4" height="2" fill="#1a1a1a"/>
    
    <!-- Side guards (fukikaeshi) -->
    <rect x="12" y="32" width="8" height="12" fill="#2d2d2d"/>
    <rect x="44" y="32" width="8" height="12" fill="#2d2d2d"/>
    
    <!-- Gold trim on side guards -->
    <rect x="12" y="32" width="8" height="2" fill="#e0a634"/>
    <rect x="44" y="32" width="8" height="2" fill="#e0a634"/>
    
    <!-- Chin guard (nodowa) -->
    <rect x="16" y="36" width="32" height="12" fill="#1a1a1a"/>
    <rect x="16" y="36" width="32" height="2" fill="#e0a634"/>
    
    <!-- Overlapping plate details on chin -->
    <rect x="18" y="42" width="28" height="2" fill="#e0a634"/>
    <rect x="20" y="46" width="24" height="2" fill="#666666"/>
  </g>
  
  <!-- Gold highlights for depth -->
  <g id="highlights">
    <rect x="18" y="18" width="3" height="2" fill="#e0a634" opacity="0.8"/>
    <rect x="43" y="18" width="3" height="2" fill="#e0a634" opacity="0.8"/>
  </g>
</svg>