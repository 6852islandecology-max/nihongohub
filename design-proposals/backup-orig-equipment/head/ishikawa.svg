<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Kaga Yuzen Crown</title>
  
  <!-- Base frame (epic purple) -->
  <g id="frame">
    <rect x="12" y="8" width="40" height="4" fill="#a056d2"/>
    <rect x="8" y="12" width="48" height="4" fill="#a056d2"/>
    <rect x="4" y="16" width="56" height="4" fill="#a056d2"/>
  </g>
  
  <!-- Silk dyed crown main body (deep indigo) -->
  <g id="crown-body">
    <rect x="8" y="20" width="48" height="8" fill="#2d1b4e"/>
    <rect x="12" y="28" width="40" height="8" fill="#3d2a5e"/>
  </g>
  
  <!-- Silk patterns (gold accents for dye detail) -->
  <g id="silk-pattern">
    <rect x="16" y="20" width="4" height="4" fill="#d4a76a"/>
    <rect x="44" y="20" width="4" height="4" fill="#d4a76a"/>
    <rect x="20" y="24" width="4" height="4" fill="#c99450"/>
    <rect x="40" y="24" width="4" height="4" fill="#c99450"/>
    <rect x="28" y="28" width="8" height="4" fill="#d4a76a"/>
  </g>
  
  <!-- Crown peaks (symmetric) -->
  <g id="peaks">
    <rect x="12" y="12" width="4" height="8" fill="#a056d2"/>
    <rect x="16" y="8" width="4" height="4" fill="#a056d2"/>
    <rect x="52" y="12" width="4" height="8" fill="#a056d2"/>
    <rect x="44" y="8" width="4" height="4" fill="#a056d2"/>
    <rect x="30" y="4" width="4" height="8" fill="#a056d2"/>
  </g>
  
  <!-- Ornamental gems (pearl white highlights) -->
  <g id="gems">
    <rect x="18" y="14" width="4" height="4" fill="#f5f0e8"/>
    <rect x="42" y="14" width="4" height="4" fill="#f5f0e8"/>
    <rect x="30" y="12" width="4" height="4" fill="#f5f0e8"/>
  </g>
  
  <!-- Lower trim detail -->
  <g id="trim">
    <rect x="16" y="36" width="32" height="4" fill="#a056d2"/>
  </g>
</svg>