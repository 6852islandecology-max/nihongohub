<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Awa Dancer Crown</title>
  
  <!-- Frame/border accent -->
  <g id="frame">
    <rect x="12" y="8" width="40" height="4" fill="#4d8fbf"/>
    <rect x="8" y="12" width="4" height="20" fill="#4d8fbf"/>
    <rect x="52" y="12" width="4" height="20" fill="#4d8fbf"/>
  </g>
  
  <!-- Main woven hat crown - tan/beige base -->
  <g id="crown">
    <!-- Top curved section -->
    <rect x="16" y="12" width="32" height="4" fill="#d4a574"/>
    <rect x="12" y="16" width="40" height="4" fill="#c99460"/>
    <rect x="12" y="20" width="40" height="4" fill="#d4a574"/>
    
    <!-- Woven texture pattern -->
    <rect x="16" y="16" width="4" height="4" fill="#b8845c"/>
    <rect x="24" y="16" width="4" height="4" fill="#b8845c"/>
    <rect x="32" y="16" width="4" height="4" fill="#b8845c"/>
    <rect x="40" y="16" width="4" height="4" fill="#b8845c"/>
    
    <!-- Mid section - wider bowl -->
    <rect x="12" y="24" width="40" height="4" fill="#c99460"/>
    <rect x="12" y="28" width="40" height="4" fill="#d4a574"/>
    
    <!-- Woven details -->
    <rect x="16" y="24" width="4" height="4" fill="#b8845c"/>
    <rect x="28" y="24" width="4" height="4" fill="#b8845c"/>
    <rect x="40" y="24" width="4" height="4" fill="#b8845c"/>
  </g>
  
  <!-- Decorative ribbon/tie accent in blue (accent color) -->
  <g id="ribbon">
    <rect x="20" y="28" width="24" height="4" fill="#4d8fbf"/>
    <rect x="18" y="32" width="4" height="4" fill="#4d8fbf"/>
    <rect x="44" y="32" width="4" height="4" fill="#4d8fbf"/>
  </g>
  
  <!-- Lower brim/edge -->
  <g id="brim">
    <rect x="10" y="32" width="44" height="4" fill="#b8845c"/>
    <rect x="8" y="36" width="48" height="4" fill="#c99460"/>
  </g>
  
  <!-- Ornamental detail - small jewel/emblem center top -->
  <g id="ornament">
    <rect x="30" y="8" width="4" height="4" fill="#e8d4a8"/>
  </g>
</svg>