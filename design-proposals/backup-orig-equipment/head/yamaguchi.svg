<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<title>Shimonoseki Pufferfish Cap</title>
<g id="pufferfish-cap">
<!-- Frame border -->
<rect x="8" y="8" width="48" height="4" fill="#9b9285"/>
<rect x="8" y="52" width="48" height="4" fill="#9b9285"/>
<rect x="8" y="12" width="4" height="40" fill="#9b9285"/>
<rect x="52" y="12" width="4" height="40" fill="#9b9285"/>

<!-- Main cap body - light tan -->
<rect x="12" y="16" width="40" height="20" fill="#e8dcc8"/>

<!-- Cap top rounded section -->
<rect x="16" y="12" width="32" height="4" fill="#e8dcc8"/>

<!-- Pufferfish mouth (dark) -->
<rect x="26" y="26" width="12" height="4" fill="#4a3728"/>

<!-- Pufferfish eyes -->
<rect x="20" y="20" width="4" height="4" fill="#2a2a2a"/>
<rect x="40" y="20" width="4" height="4" fill="#2a2a2a"/>
<rect x="22" y="22" width="2" height="2" fill="#ffffff"/>
<rect x="42" y="22" width="2" height="2" fill="#ffffff"/>

<!-- Spikes (pufferfish bumps) - yellow-gold -->
<rect x="14" y="12" width="4" height="4" fill="#d4af37"/>
<rect x="46" y="12" width="4" height="4" fill="#d4af37"/>
<rect x="10" y="24" width="4" height="4" fill="#d4af37"/>
<rect x="50" y="24" width="4" height="4" fill="#d4af37"/>
<rect x="14" y="36" width="4" height="4" fill="#d4af37"/>
<rect x="46" y="36" width="4" height="4" fill="#d4af37"/>

<!-- Bill/visor -->
<rect x="16" y="36" width="32" height="8" fill="#c9b89a"/>
<rect x="16" y="36" width="32" height="2" fill="#9b9285"/>

<!-- Chin strap -->
<rect x="24" y="44" width="16" height="2" fill="#8b7d6b"/>
<rect x="22" y="46" width="4" height="2" fill="#8b7d6b"/>
<rect x="38" y="46" width="4" height="2" fill="#8b7d6b"/>
</g>
</svg>