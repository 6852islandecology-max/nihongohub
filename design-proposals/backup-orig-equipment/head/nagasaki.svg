<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Castella Baker's Cap</title>
  
  <!-- Outer frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Cap structure -->
  <g id="cap">
    <!-- Main cap body (tan/cream) -->
    <rect x="12" y="20" width="40" height="4" fill="#f5e6d3"/>
    <rect x="10" y="24" width="44" height="4" fill="#f5e6d3"/>
    <rect x="8" y="28" width="48" height="4" fill="#f5e6d3"/>
    <rect x="8" y="32" width="48" height="4" fill="#f5e6d3"/>
    
    <!-- Top rounded crown -->
    <rect x="14" y="16" width="36" height="4" fill="#f5e6d3"/>
    <rect x="16" y="12" width="32" height="4" fill="#f5e6d3"/>
    <rect x="20" y="8" width="24" height="4" fill="#f5e6d3"/>
    
    <!-- Crown highlight (lighter) -->
    <rect x="22" y="8" width="20" height="2" fill="#fdf4e6"/>
    
    <!-- Band/trim detail -->
    <rect x="8" y="36" width="48" height="2" fill="#9b9285"/>
    
    <!-- Brim edge left -->
    <rect x="6" y="36" width="2" height="4" fill="#9b9285"/>
    <!-- Brim edge right -->
    <rect x="56" y="36" width="2" height="4" fill="#9b9285"/>
    
    <!-- Brim bottom -->
    <rect x="8" y="40" width="48" height="2" fill="#d4c5b9"/>
    
    <!-- Face opening shading (left) -->
    <rect x="18" y="28" width="2" height="8" fill="#e0d1c3"/>
    <!-- Face opening shading (right) -->
    <rect x="44" y="28" width="2" height="8" fill="#e0d1c3"/>
    
    <!-- Front detail line -->
    <rect x="28" y="24" width="8" height="2" fill="#d4c5b9"/>
  </g>
</svg>