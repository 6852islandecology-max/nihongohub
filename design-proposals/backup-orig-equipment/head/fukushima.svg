<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
<title>Akabeko Mask</title>
<g id="akabeko-mask">
<!-- Frame border -->
<rect x="8" y="8" width="48" height="48" fill="none" stroke="#9b9285" stroke-width="2"/>
<!-- Main red mask shape -->
<rect x="12" y="16" width="40" height="28" fill="#c41e3a"/>
<!-- Left horn base -->
<rect x="16" y="12" width="8" height="8" fill="#c41e3a"/>
<!-- Right horn base -->
<rect x="40" y="12" width="8" height="8" fill="#c41e3a"/>
<!-- Left horn accent -->
<rect x="16" y="10" width="8" height="2" fill="#9b9285"/>
<!-- Right horn accent -->
<rect x="40" y="10" width="8" height="2" fill="#9b9285"/>
<!-- Left eye white -->
<rect x="20" y="20" width="6" height="6" fill="#f5f5f5"/>
<!-- Right eye white -->
<rect x="38" y="20" width="6" height="6" fill="#f5f5f5"/>
<!-- Left eye pupil -->
<rect x="21" y="21" width="4" height="4" fill="#2c2c2c"/>
<!-- Right eye pupil -->
<rect x="39" y="21" width="4" height="4" fill="#2c2c2c"/>
<!-- Snout/muzzle area -->
<rect x="24" y="28" width="16" height="8" fill="#ffffff"/>
<!-- Snout spots left -->
<rect x="26" y="30" width="3" height="3" fill="#2c2c2c"/>
<!-- Snout spots right -->
<rect x="35" y="30" width="3" height="3" fill="#2c2c2c"/>
<!-- Mouth line -->
<rect x="28" y="36" width="8" height="2" fill="#2c2c2c"/>
<!-- Chin accent -->
<rect x="20" y="44" width="24" height="2" fill="#9b9285"/>
</g>
</svg>