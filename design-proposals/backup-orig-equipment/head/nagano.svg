<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Zenkoji Pilgrim Hood</title>
  
  <!-- Main hood structure -->
  <g id="hood">
    <!-- Hood top/crown -->
    <rect x="20" y="8" width="24" height="4" fill="#3d5f7f"/>
    
    <!-- Hood sides - left -->
    <rect x="16" y="12" width="4" height="20" fill="#4d8fbf"/>
    <rect x="12" y="16" width="4" height="16" fill="#3d5f7f"/>
    
    <!-- Hood sides - right -->
    <rect x="44" y="12" width="4" height="20" fill="#4d8fbf"/>
    <rect x="48" y="16" width="4" height="16" fill="#3d5f7f"/>
    
    <!-- Hood center front -->
    <rect x="20" y="12" width="24" height="4" fill="#4d8fbf"/>
    <rect x="24" y="16" width="16" height="8" fill="#5a9fcf"/>
    
    <!-- Hood face opening outline -->
    <rect x="20" y="16" width="4" height="12" fill="#3d5f7f"/>
    <rect x="40" y="16" width="4" height="12" fill="#3d5f7f"/>
    
    <!-- Face area (flesh tone) -->
    <rect x="24" y="24" width="16" height="8" fill="#c9a876"/>
    
    <!-- Hood lower edge -->
    <rect x="16" y="32" width="32" height="4" fill="#3d5f7f"/>
    
    <!-- Temple decoration - left -->
    <rect x="16" y="28" width="4" height="4" fill="#d4af37"/>
    
    <!-- Temple decoration - right -->
    <rect x="44" y="28" width="4" height="4" fill="#d4af37"/>
    
    <!-- Chin strap -->
    <rect x="24" y="32" width="4" height="4" fill="#2d4f6f"/>
    <rect x="36" y="32" width="4" height="4" fill="#2d4f6f"/>
    
    <!-- Frame border accent -->
    <rect x="12" y="8" width="40" height="28" fill="none" stroke="#4d8fbf" stroke-width="1"/>
  </g>
</svg>