<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Namahage Mask</title>
  
  <!-- Purple frame border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#a056d2" stroke-width="4"/>
  
  <!-- Main red mask face -->
  <rect x="12" y="12" width="40" height="36" fill="#d32f2f"/>
  
  <!-- Left horn -->
  <rect x="8" y="8" width="8" height="8" fill="#8b4513"/>
  <rect x="6" y="6" width="4" height="4" fill="#a0522d"/>
  
  <!-- Right horn -->
  <rect x="48" y="8" width="8" height="8" fill="#8b4513"/>
  <rect x="54" y="6" width="4" height="4" fill="#a0522d"/>
  
  <!-- Left eye socket -->
  <rect x="18" y="20" width="8" height="8" fill="#000000"/>
  <rect x="19" y="21" width="6" height="6" fill="#1a1a1a"/>
  
  <!-- Right eye socket -->
  <rect x="38" y="20" width="8" height="8" fill="#000000"/>
  <rect x="39" y="21" width="6" height="6" fill="#1a1a1a"/>
  
  <!-- Nose -->
  <rect x="30" y="28" width="4" height="8" fill="#a01010"/>
  <rect x="29" y="28" width="6" height="4" fill="#a01010"/>
  
  <!-- Mouth (menacing grin) -->
  <rect x="16" y="36" width="4" height="4" fill="#000000"/>
  <rect x="20" y="36" width="4" height="4" fill="#ffeeaa"/>
  <rect x="24" y="36" width="4" height="4" fill="#ffeeaa"/>
  <rect x="28" y="36" width="4" height="4" fill="#ffeeaa"/>
  <rect x="32" y="36" width="4" height="4" fill="#ffeeaa"/>
  <rect x="36" y="36" width="4" height="4" fill="#ffeeaa"/>
  <rect x="40" y="36" width="4" height="4" fill="#000000"/>
  
  <!-- Mouth shadow detail -->
  <rect x="20" y="40" width="24" height="4" fill="#8b0000"/>
  
  <!-- Red cheek markings -->
  <rect x="12" y="28" width="4" height="4" fill="#ff5555"/>
  <rect x="48" y="28" width="4" height="4" fill="#ff5555"/>
</svg>