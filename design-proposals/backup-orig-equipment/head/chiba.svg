<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Narita Pilgrim Helm</title>
  
  <!-- Frame border -->
  <g id="frame">
    <rect x="4" y="4" width="56" height="56" fill="none" stroke="#9b9285" stroke-width="2"/>
  </g>
  
  <!-- Helmet structure -->
  <g id="helm">
    <!-- Top dome of helmet -->
    <rect x="20" y="12" width="4" height="4" fill="#2c1810"/>
    <rect x="24" y="8" width="16" height="4" fill="#2c1810"/>
    <rect x="40" y="12" width="4" height="4" fill="#2c1810"/>
    
    <!-- Upper helmet curve -->
    <rect x="16" y="16" width="4" height="4" fill="#3d2817"/>
    <rect x="20" y="16" width="24" height="4" fill="#2c1810"/>
    <rect x="44" y="16" width="4" height="4" fill="#3d2817"/>
    
    <!-- Temple guards (fukikaeshi) -->
    <rect x="12" y="20" width="4" height="8" fill="#9b9285"/>
    <rect x="48" y="20" width="4" height="8" fill="#9b9285"/>
    
    <!-- Face opening frame -->
    <rect x="16" y="20" width="32" height="4" fill="#9b9285"/>
    
    <!-- Face plate area -->
    <rect x="20" y="24" width="6" height="12" fill="#1a0f0a"/>
    <rect x="26" y="24" width="12" height="12" fill="#0a0604"/>
    <rect x="38" y="24" width="6" height="12" fill="#1a0f0a"/>
    
    <!-- Eye openings -->
    <rect x="22" y="28" width="4" height="4" fill="#4a3020"/>
    <rect x="38" y="28" width="4" height="4" fill="#4a3020"/>
    
    <!-- Center crest detail -->
    <rect x="30" y="20" width="4" height="4" fill="#d4a574"/>
    
    <!-- Chin guard -->
    <rect x="16" y="36" width="32" height="4" fill="#9b9285"/>
    
    <!-- Neck guard (kusazuri) -->
    <rect x="18" y="40" width="4" height="4" fill="#3d2817"/>
    <rect x="22" y="40" width="4" height="4" fill="#2c1810"/>
    <rect x="26" y="40" width="4" height="4" fill="#3d2817"/>
    <rect x="30" y="40" width="4" height="4" fill="#2c1810"/>
    <rect x="34" y="40" width="4" height="4" fill="#3d2817"/>
    <rect x="38" y="40" width="4" height="4" fill="#2c1810"/>
    <rect x="42" y="40" width="4" height="4" fill="#3d2817"/>
    
    <!-- Lower neck guard -->
    <rect x="20" y="44" width="24" height="4" fill="#9b9285"/>
  </g>
</svg>