<svg viewBox="0 0 64 64" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <title>Ii Red Helm</title>
  
  <!-- Gold frame border -->
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="#e0a634" stroke-width="2"/>
  
  <!-- Helmet main body - crimson red -->
  <rect x="12" y="16" width="40" height="28" fill="#c41e3a"/>
  
  <!-- Helmet top peak -->
  <rect x="20" y="12" width="24" height="4" fill="#c41e3a"/>
  <rect x="18" y="8" width="28" height="4" fill="#c41e3a"/>
  
  <!-- Gold accent trim -->
  <rect x="12" y="16" width="40" height="2" fill="#e0a634"/>
  <rect x="12" y="42" width="40" height="2" fill="#e0a634"/>
  
  <!-- Left side ornament -->
  <rect x="10" y="20" width="2" height="12" fill="#e0a634"/>
  <rect x="8" y="24" width="4" height="4" fill="#e0a634"/>
  
  <!-- Right side ornament (mirror) -->
  <rect x="52" y="20" width="2" height="12" fill="#e0a634"/>
  <rect x="52" y="24" width="4" height="4" fill="#e0a634"/>
  
  <!-- Face opening - dark -->
  <rect x="20" y="28" width="24" height="12" fill="#1a1a1a"/>
  
  <!-- Eye slots -->
  <rect x="22" y="32" width="4" height="4" fill="#2a2a2a"/>
  <rect x="38" y="32" width="4" height="4" fill="#2a2a2a"/>
  
  <!-- Central crest accent - darker red -->
  <rect x="30" y="12" width="4" height="4" fill="#8b0000"/>
  <rect x="28" y="8" width="8" height="2" fill="#8b0000"/>
  
  <!-- Bottom guard -->
  <rect x="16" y="44" width="32" height="4" fill="#8b0000"/>
  <rect x="14" y="48" width="36" height="2" fill="#e0a634"/>
</svg>